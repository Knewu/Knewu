<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>사회자 콘솔 — 상임위원 워크숍</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ivory:#F5F2EA;--navy:#13234A;--panel:#1C2F5C;--line:#2C4176;--sub:#A9B3C7;--accent:#E8623A;--gold:#F2B544;--ink:#0C1834}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;background:var(--navy);color:var(--ivory);min-height:100dvh;padding-bottom:40px}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.h-org{font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--sub)}
.h-title{font-size:19px;font-weight:900;margin-top:2px}
.chip{font-size:12px;font-weight:700;padding:6px 12px;border-radius:99px;background:var(--gold);color:var(--ink);white-space:nowrap}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:12px 16px 0;max-width:520px;margin:0 auto}
.tabs button{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ivory);font-size:14px;font-weight:700}
.tabs button.on{background:var(--ivory);color:var(--ink)}
main{max-width:520px;margin:0 auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.sec-t{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--gold);margin:4px 2px 8px}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:var(--ivory);margin-bottom:8px;min-height:56px}
.item .t{display:block;font-size:15px;font-weight:700}
.item .d{display:block;font-size:12px;color:var(--sub);margin-top:2px}
.pill{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--ivory);color:var(--ink);white-space:nowrap}
.pill.off{background:var(--line);color:var(--sub)}
.btn{width:100%;min-height:50px;padding:14px;border-radius:14px;border:none;font-size:15px;font-weight:900;background:var(--ivory);color:var(--ink)}
.btn.main{background:var(--accent);font-size:16px}
.btn.ghost{background:var(--panel);color:var(--ivory);border:1px solid var(--line)}
.btn.danger{background:#5A1F1A;color:#FFD9D2;border:1px solid #8A3329}
.btn:disabled{opacity:.35}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.row:last-child{border-bottom:none}
.dot{width:10px;height:10px;border-radius:99px;flex:none}
.num{width:28px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
.muted{color:var(--sub);font-size:12px;line-height:1.6}
.strike{text-decoration:line-through;color:var(--sub)}
.big{font-size:60px;font-weight:900;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.gl{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px}
.gauge{position:relative;height:22px;border-radius:99px;overflow:hidden}
.gauge .fill{height:100%;transition:width .15s linear}
.gauge .mid{position:absolute;top:0;left:50%;width:2px;height:100%;background:var(--ink)}
.step{display:flex;align-items:center;gap:10px}
.step button{width:44px;height:44px;border-radius:12px;border:none;background:var(--line);color:var(--ivory);font-size:20px;font-weight:700}
.step b{min-width:44px;text-align:center;font-size:20px}
.sm{min-width:44px;min-height:40px;border-radius:10px;border:none;background:var(--line);color:var(--ivory);font-weight:700;font-size:15px}
.tchip{min-height:36px;padding:0 12px;border-radius:99px;border:none;font-size:12px;font-weight:700;color:var(--ink)}
.field{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--navy);color:var(--ivory);font-size:15px}
.light{height:120px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900}
#keyScreen{max-width:400px;margin:80px auto;padding:0 20px;display:flex;flex-direction:column;gap:12px}
.err{color:#FFB4A8;font-size:13px;min-height:18px}
</style>
</head>
<body>
<div id="keyScreen">
  <div style="font-size:24px;font-weight:900">사회자 콘솔</div>
  <div class="muted">사회자 비밀번호를 넣어 주세요</div>
  <input class="field" id="keyIn" type="password" autocomplete="off">
  <div class="err" id="keyMsg"></div>
  <button class="btn" id="keyBtn">들어가기</button>
</div>
<div id="console" style="display:none">
<header>
  <div><div class="h-org">12.10 상임위원 워크숍</div><div class="h-title">사회자 콘솔</div></div>
  <span class="chip" id="hCount">접속 0명</span>
</header>
<div class="tabs">
  <button data-tab="run" class="on">진행</button>
  <button data-tab="team">팀·인원</button>
  <button data-tab="score">점수</button>
</div>
<main id="main"></main>
</div>

<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue, update, remove, increment, serverTimestamp, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyB186Tg9fsrnR-K_lufo4X5iY9OVpgDeHk",
  authDomain: "knewu24th-15ebc.firebaseapp.com",
  databaseURL: "https://knewu24th-15ebc-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "knewu24th-15ebc",
  storageBucket: "knewu24th-15ebc.firebasestorage.app",
  messagingSenderId: "617159229534",
  appId: "1:617159229534:web:360195e7b3bc5a38b034cf"
};
const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const db = getDatabase(app);

// ===== 공통 (host / index / board 동일) =====
const ROOT = 'workshop_2026';
const TEAM_COLORS = {1:'#E8623A',2:'#58A6F0',3:'#F2B544',4:'#3FC1A0'};
const DEFAULT_TEAM_NAMES = {1:'1팀',2:'2팀',3:'3팀',4:'4팀'};
const NUNCHI_WINDOW = 300;   // ms 안에 같이 누르면 동시
const MUGUNG_GRACE = 250;    // 빨간불 받은 직후 봐주는 시간(ms)
const TUG_SECONDS = 10;
const COUNTDOWN_MS = 3500;
const GAME_TITLES = {lobby:'대기', tug:'폰 줄다리기', nunchi:'눈치게임', mugung:'무궁화 꽃이 피었습니다'};

function esc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function teamName(cfg, t){ return (cfg && cfg.teamNames && cfg.teamNames[t]) || DEFAULT_TEAM_NAMES[t] || '미배정'; }
function teamColor(t){ return TEAM_COLORS[t] || '#2C4176'; }
function teamCount(cfg){ const n = cfg && Number(cfg.teamCount); return (n===4) ? 4 : 3; }
function teamList(cfg){ const n = teamCount(cfg); const a=[]; for(let i=1;i<=n;i++) a.push(i); return a; }
function playerName(players, pid){ return (players && players[pid] && players[pid].name) || '(나감)'; }
function teamMembers(players, t){
  return Object.keys(players||{}).filter(pid => players[pid] && Number(players[pid].team) === t)
    .sort((x,y)=> (players[x].at||0) - (players[y].at||0));
}

// ── 줄다리기: 팀 평균 연타수로 비교 (인원 다른 팀도 공정)
function tugStats(players, taps, a, b){
  const res = {};
  [a,b].forEach(t=>{
    const mem = teamMembers(players, t);
    let sum = 0;
    mem.forEach(pid=>{ sum += Math.max(0, Number((taps||{})[pid])||0); });
    res[t] = {sum, n: mem.length, avg: mem.length ? sum/mem.length : 0};
  });
  const A = res[a].avg, B = res[b].avg, tot = A + B;
  res.share = tot > 0 ? A / tot : 0.5;          // a팀 쪽 비율 0~1
  res.winner = (A === B) ? 0 : (A > B ? a : b);
  return res;
}

// ── 눈치게임 판정
// alive: 참가자 pid 목록, presses: {pid: 서버시각(ms)}
// 같은 숫자 = 그 숫자를 처음 누른 사람 기준 windowMs 안에 누른 사람들 → 모두 탈락
// 한 명만 남으면 끝, 그 사람이 꼴찌 탈락 (그 뒤 누른 건 무효)
function judgeNunchi(alive, presses, windowMs){
  windowMs = windowMs || NUNCHI_WINDOW;
  const aliveSet = new Set(alive);
  const list = Object.keys(presses||{})
    .filter(pid => aliveSet.has(pid) && typeof presses[pid] === 'number')
    .map(pid => ({pid, ts: presses[pid]}))
    .sort((x,y)=> (x.ts - y.ts) || (x.pid < y.pid ? -1 : 1));
  const groups = [];
  list.forEach(p=>{
    const g = groups[groups.length-1];
    if (g && p.ts - g.first < windowMs) g.pids.push(p.pid);
    else groups.push({pids:[p.pid], first:p.ts});
  });
  let num = 0, remaining = alive.length, ended = remaining <= 1;
  const rows = [], safe = [], out = [];
  for (const g of groups){
    if (ended) break;
    num++;
    if (g.pids.length === 1){ safe.push(g.pids[0]); rows.push({num, pids:g.pids.slice(), kind:'safe'}); }
    else { g.pids.forEach(p=>out.push(p)); rows.push({num, pids:g.pids.slice(), kind:'clash'}); }
    remaining -= g.pids.length;
    if (remaining <= 1) ended = true;
  }
  const done = new Set(safe.concat(out));
  const unpressed = alive.filter(p => !done.has(p));
  return {rows, next: num + 1, safe, out, unpressed, ended, last: ended ? unpressed.slice() : []};
}

// ── 무궁화 순위: 골인 순 → 생존자 진행도 순 → 탈락자
function rankMugung(alive, prog, goal){
  const rows = alive.map(pid=>{
    const d = (prog||{})[pid] || {};
    return {pid, p: Math.min(goal, Math.max(0, Number(d.p)||0)), out: !!d.out, fin: (typeof d.fin === 'number') ? d.fin : null};
  });
  rows.sort((x,y)=>{
    const gx = x.out ? 2 : (x.fin != null ? 0 : 1), gy = y.out ? 2 : (y.fin != null ? 0 : 1);
    if (gx !== gy) return gx - gy;
    if (gx === 0) return x.fin - y.fin;
    return y.p - x.p;
  });
  let r = 0;
  rows.forEach(row=>{ row.rank = row.out ? null : ++r; });
  return rows;
}
function mugungAllDone(alive, prog){
  return alive.length > 0 && alive.every(pid=>{ const d = (prog||{})[pid] || {}; return d.out || typeof d.fin === 'number'; });
}
const MUGUNG_POINTS = [3,2,1];

// Firebase 는 배열을 객체로 돌려줄 때가 있어서 받자마자 배열로 맞춤
function asList(v){ return Array.isArray(v) ? v.filter(x => x != null) : Object.values(v || {}); }
function normState(s){
  s = s || {game:'lobby'};
  if (s.alive) s.alive = asList(s.alive);
  if (s.result) ['survivors','losers','survivorNames','loserNames','rows'].forEach(k => { if (s.result[k]) s.result[k] = asList(s.result[k]); });
  return s;
}

// 균등 랜덤 배정 (인원 차이 최대 1명)
function balancedAssign(pids, n, rnd){
  rnd = rnd || Math.random;
  const a = pids.slice();
  for (let i=a.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  const out = {};
  a.forEach((pid,i)=>{ out[pid] = (i % n) + 1; });
  return out;
}
// ===== 공통 끝 =====

// 비밀번호는 해시로만 들어 있어요 (바꾸려면 새 비밀번호의 SHA-256 값으로 교체)
const HOST_HASH = 'e21651bcd4fce649dd14355c92bedfee270ff7e64154f6b142b173f25c32cd36';

const R = p => ref(db, ROOT + '/' + p);
const $ = id => document.getElementById(id);
const now = () => Date.now() + offset;
const rand = (a,b) => a + Math.random()*(b-a);

let players = {}, cfg = {}, scores = {}, ST = {game:'lobby'}, offset = 0;
let play = {}, playKey = '', playUnsub = null;
let TAB = 'run', screenKey = '', finalizing = false;
let pts = {tug:3, nunchi:1};
let mugGoal = 50, autoLight = true, lightTimer = null;

// ── 비밀번호
async function sha256(s){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}
async function tryKey(){
  const v = $('keyIn').value;
  if ((await sha256(v)) === HOST_HASH){ sessionStorage.setItem('ws26_host','1'); openConsole(); }
  else $('keyMsg').textContent = '비밀번호가 달라요';
}
$('keyBtn').onclick = tryKey;
$('keyIn').onkeydown = e => { if (e.key === 'Enter') tryKey(); };
if (sessionStorage.getItem('ws26_host') === '1') openConsole();

let started = false;
function openConsole(){
  if (started) return; started = true;
  $('keyScreen').style.display = 'none';
  $('console').style.display = 'block';
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
    TAB = b.dataset.tab;
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
    screenKey = ''; render();
  });
  document.addEventListener('click', keepAwake, {once:true});
  onValue(ref(db, '.info/serverTimeOffset'), s => { offset = s.val() || 0; });
  onValue(R('players'), s => { players = s.val() || {}; render(); });
  onValue(R('config'), s => { cfg = s.val() || {}; render(); });
  onValue(R('scores'), s => { scores = s.val() || {}; render(); });
  onValue(R('state'), s => { ST = normState(s.val()); finalizing = false; syncPlay(); render(); });
  setInterval(tick, 150);
}
async function keepAwake(){ try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch(e){} }

function syncPlay(){
  const g = ST.game, r = ST.round || '';
  const key = (['tug','nunchi','mugung'].includes(g) && r) ? g + '/' + r : '';
  if (key === playKey) return;
  if (playUnsub){ playUnsub(); playUnsub = null; }
  playKey = key; play = {};
  if (key) playUnsub = onValue(R('play/' + key), s => { play = s.val() || {}; tick(); });
}

// ── 상태 쓰기
const setState = s => set(R('state'), s);
const newRound = () => 'r' + Date.now().toString(36);
function openGame(g){ setState({game: g, phase: 'setup'}); }
function toLobby(){ clearLight(); setState({game: 'lobby'}); }

// ── 화면
function render(){
  if (!started) return;
  $('hCount').textContent = '접속 ' + Object.keys(players).length + '명';
  const ae = document.activeElement;
  if (ae && ae.tagName === 'INPUT' && $('main').contains(ae)) return;   // 팀 이름 입력 중엔 다시 그리지 않음
  const key = keyNow();
  if (key !== screenKey){
    screenKey = key;
    $('main').innerHTML = build();
    bind();
  }
  ensureLightDriver();
  tick();
}
function keyNow(){
  if (TAB === 'team') return 'team|' + JSON.stringify([players, cfg]);
  if (TAB === 'score') return 'score|' + JSON.stringify([players, cfg, scores]);
  const g = ST.game || 'lobby';
  if (g === 'lobby') return 'menu|' + JSON.stringify(cfg.teamCount||3);
  return ['run', g, ST.phase, ST.round, JSON.stringify(ST.result||null), JSON.stringify([players, cfg]), pts.tug, pts.nunchi, mugGoal, autoLight].join('|');
}
function build(){
  if (TAB === 'team') return teamTab();
  if (TAB === 'score') return scoreTab();
  const g = ST.game || 'lobby';
  if (g === 'lobby') return menuView();
  const back = `<button class="btn ghost" data-act="lobby">메뉴로 (참가자는 대기 화면)</button>`;
  if (g === 'tug') return tugPanel() + back;
  if (g === 'nunchi') return nunchiPanel() + back;
  if (g === 'mugung') return mugungPanel() + back;
  return menuView();
}

// 버튼은 data-act 로 한 번에 연결
function bind(){
  $('main').querySelectorAll('[data-act]').forEach(el => {
    el.onclick = () => act(el.dataset.act, el.dataset);
  });
  $('main').querySelectorAll('input[data-tname]').forEach(el => {
    el.onchange = () => {
      const t = el.dataset.tname, v = el.value.trim().slice(0, 10);
      set(R('config/teamNames/' + t), v || DEFAULT_TEAM_NAMES[t]);
      el.blur();
    };
  });
}

async function act(a, d){
  switch(a){
    case 'lobby': toLobby(); break;
    case 'open': openGame(d.g); break;
    case 'tugStart': startTug(Number(d.a), Number(d.b)); break;
    case 'tugEnd': update(R('state'), {endAt: now()}); break;
    case 'ptsUp': pts[d.g] = Math.min(10, pts[d.g] + 1); render(); break;
    case 'ptsDn': pts[d.g] = Math.max(1, pts[d.g] - 1); render(); break;
    case 'apply': applyResult(); break;
    case 'nunchiStart': startNunchi(); break;
    case 'nunchiEnd': finalizeNunchi(); break;
    case 'mugGoal': mugGoal = Number(d.v); render(); break;
    case 'mugStart': startMugung(); break;
    case 'mugEnd': finalizeMugung(); break;
    case 'mugAuto': autoLight = !autoLight; clearLight(); render(); break;
    case 'mugLight': update(R('state'), {light: d.v, lightAt: now()}); break;
    case 'teamCount': setTeamCount(Number(d.v)); break;
    case 'shuffle': shuffleTeams(); break;
    case 'clearTeams': clearTeams(); break;
    case 'cycle': cycleTeam(d.pid); break;
    case 'kick': kick(d.pid); break;
    case 'tPlus': update(R('scores/team'), {[d.t]: increment(Number(d.v))}); break;
    case 'pPlus': update(R('scores/player'), {[d.pid]: increment(Number(d.v))}); break;
    case 'resetScores': if (confirm('팀·개인 점수를 전부 0으로 할까요?')) remove(R('scores')); break;
    case 'resetAll':
      if (confirm('참가자·점수·게임 기록을 전부 지울까요? (리허설 끝나고 본 행사 전에 한 번)')){
        clearLight();
        await update(ref(db, ROOT), {players: null, scores: null, play: null, log: null, state: {game:'lobby'}});
      }
      break;
    case 'copy': copyText(d.url); break;
  }
}

// ── 메뉴
function menuItem(title, desc, g, ready){
  return ready
    ? `<button class="item" data-act="open" data-g="${g}"><span style="flex:1"><span class="t">${title}</span><span class="d">${desc}</span></span><span class="pill">열기</span></button>`
    : `<div class="item" style="opacity:.6"><span style="flex:1"><span class="t">${title}</span><span class="d">${desc}</span></span><span class="pill off">준비 중</span></div>`;
}
function menuView(){
  const n = Object.keys(players).length;
  const unassigned = Object.values(players).filter(p => !Number(p.team)).length;
  const warn = unassigned ? `<div class="card muted" style="color:var(--gold)">팀이 안 정해진 사람이 ${unassigned}명 있어요. 팀전 전에 「팀·인원」 탭에서 배정해 주세요.</div>` : '';
  return `${warn}
  <div><div class="sec-t">팀 짜기</div>
    <div class="item" style="opacity:.6"><span style="flex:1"><span class="t">팀 짜기 게임</span><span class="d">방식 보류 · 지금은 「팀·인원」 탭에서 랜덤 배정</span></span><span class="pill off">보류</span></div></div>
  <div><div class="sec-t">팀전</div>
    ${menuItem('폰 줄다리기', '10초 연타 · 팀 평균으로 비교', 'tug', true)}
    ${menuItem('폭탄 해체', '1명은 폭탄, 나머지는 매뉴얼', 'bomb', false)}
    ${menuItem('릴레이 캐치마인드', '이어 그리기 · 다른 팀이 맞히기', 'draw', false)}
    ${menuItem('인간 피아노', '색 버튼 하나씩 · 순서대로', 'piano', false)}</div>

function startMugung(){

function clearLight(){ if (lightTimer){ clearTimeout(lightTimer); lightTimer = null; } }
function ensureLightDriver(){
  if (ST.game !== 'mugung' || ST.phase !== 'live' || !autoLight){ clearLight(); return; }
  if (lightTimer) return;
  const t = now();
  const from = Math.max(t, ST.startAt || t);
  const dur = ST.light === 'red' ? rand(1500, 3000) : rand(1800, 4500);
  lightTimer = setTimeout(() => {
    lightTimer = null;
    if (ST.game !== 'mugung' || ST.phase !== 'live' || !autoLight) return;
    update(R('state'), {light: ST.light === 'red' ? 'green' : 'red', lightAt: now()});
  }, (from - t) + dur);
}
async function finalizeMugung(){
  if (finalizing || ST.phase !== 'live') return; finalizing = true;
  try{
  clearLight();
  const prog = (await get(R('play/mugung/' + ST.round))).val() || {};
  const rows = rankMugung(ST.alive || [], prog, ST.goal).map(r => ({pid:r.pid, name: playerName(players, r.pid), p:r.p, out:r.out, fin: r.fin!=null, rank: r.rank}));
  await update(R('state'), {phase:'result', result:{kind:'mugung', rows, goal: ST.goal, applied:false}});
  }catch(e){ finalizing = false; console.warn(e); }
}

// ── 점수 반영 (한 번만)
async function applyResult(){
  const r = ST.result || {};
  if (r.applied) return;
  const u = {}, add = (path, n) => { u[path] = (u[path] || 0) + n; };
  let text = '';
  if (r.kind === 'tug' && r.winner){
    add('scores/team/' + r.winner, pts.tug);
    text = '줄다리기 ' + teamName(cfg, r.winner) + ' +' + pts.tug;
  } else if (r.kind === 'nunchi'){
    (r.survivors||[]).forEach(pid => {
      add('scores/player/' + pid, pts.nunchi);
      const t = players[pid] && Number(players[pid].team);
      if (t) add('scores/team/' + t, pts.nunchi);
    });
    text = '눈치게임 생존 ' + (r.survivors||[]).length + '명 +' + pts.nunchi;
  } else if (r.kind === 'mugung'){
    (r.rows||[]).forEach(x => {
      if (!x.rank || x.rank > 3) return;
      const n = MUGUNG_POINTS[x.rank - 1];
      add('scores/player/' + x.pid, n);
      const t = players[x.pid] && Number(players[x.pid].team);
      if (t) add('scores/team/' + t, n);
    });
    text = '무궁화 1~3등';
  } else return;
  const out = {};
  Object.keys(u).forEach(k => out[k] = increment(u[k]));
  out['state/result/applied'] = true;
  out['log/' + push(R('log')).key] = {at: serverTimestamp(), text};
  await update(ref(db, ROOT), out);
}

function shuffleTeams(){

    $('tugFill').style.width = (s.share*100).toFixed(1) + '%';

  if (ST.game === 'nunchi'){
    const el = $('nNext'); if (!el) return;
    const j = judgeNunchi(ST.alive || [], play);
    el.textContent = t < ST.startAt ? '준비' : (j.ended ? '끝' : j.next);
    $('nLeft').textContent = '안 누른 사람 ' + j.unpressed.length + '명';
    $('nList').innerHTML = j.rows.map(r => `<div class="row"><span class="num" style="${r.kind==='clash'?'color:var(--accent)':''}">${r.num}</span>
      <span style="flex:1;font-weight:700" class="${r.kind==='clash'?'strike':''}">${r.pids.map(p => esc(playerName(players,p))).join(' · ')}</span>${r.kind==='clash'?'<span class="muted">동시 탈락</span>':''}</div>`).join('');
    if (j.ended){ if (!ST._endSeen){ ST._endSeen = t; } if (t - ST._endSeen > 900) finalizeNunchi(); }
  }
  if (ST.game === 'mugung'){
    const el = $('mLight'); if (!el) return;
    const red = ST.light === 'red';
    el.textContent = t < ST.startAt ? '준비' : (red ? '빨간불' : '초록불');
    el.style.background = t < ST.startAt ? 'var(--line)' : (red ? '#A8231C' : '#1E7A4C');
    const rows = rankMugung(ST.alive || [], play, ST.goal);
    $('mInfo').textContent = '골인 ' + rows.filter(r => r.fin != null).length + ' · 탈락 ' + rows.filter(r => r.out).length + ' / ' + rows.length + '명';
    $('mList').innerHTML = rows.map(r => `<div class="row"><span class="num">${r.rank||'-'}</span><span style="flex:1;font-weight:700" class="${r.out?'strike':''}">${esc(playerName(players,r.pid))}</span>
      <span class="muted">${r.out?'탈락':(r.fin!=null?'골인':r.p+'/'+ST.goal)}</span></div>`).join('');
    if (t > ST.startAt && (mugungAllDone(ST.alive || [], play) || t > ST.startAt + 120000)) finalizeMugung();
  }
}
</script>
</body>
</html>
