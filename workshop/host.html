<!DOCTYPE html>

<style>

html,body{margin:0}

input{font-family:inherit}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 12px;border-bottom:1px solid var(--line)}

.chip{font-size:12px;font-weight:700;padding:6px 12px;border-radius:99px;background:var(--gold);color:var(--ink);white-space:nowrap}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:12px 16px 0;max-width:520px;margin:0 auto}
.tabs button{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ivory);font-size:14px;font-weight:700}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}

.sm{min-width:44px;min-height:40px;border-radius:10px;border:none;background:var(--line);color:var(--ivory);font-weight:700;font-size:15px}

.light{height:120px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900}
#keyScreen{max-width:400px;margin:80px auto;padding:0 20px;display:flex;flex-direction:column;gap:12px}

<script type="module">

  ennea:'에니어그램 팀 짜기', piano:'인간 피아노', draw:'릴레이 캐치마인드', bomb:'폭탄 해체', t10:'10초 맞히기', minor:'소수파 생존', chicken:'치킨 버튼'};

function esc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function teamName(cfg, t){ return (cfg && cfg.teamNames && cfg.teamNames[t]) || DEFAULT_TEAM_NAMES[t] || '미배정'; }
function teamColor(t){ return TEAM_COLORS[t] || '#2C4176'; }
function teamCount(cfg){ const n = cfg && Number(cfg.teamCount); return (n===4) ? 4 : 3; }
function teamList(cfg){ const n = teamCount(cfg); const a=[]; for(let i=1;i<=n;i++) a.push(i); return a; }
function playerName(players, pid){ return (players && players[pid] && players[pid].name) || '(나감)'; }
function teamMembers(players, t){
  return Object.keys(players||{}).filter(pid => players[pid] && Number(players[pid].team) === t)
    .sort((x,y)=> (players[x].at||0) - (players[y].at||0));
}

// ── 줄다리기: 팀 평균 연타수로 비교 (인원 다른 팀도 공정)
function tugStats(players, taps, a, b){
  const res = {};
  [a,b].forEach(t=>{
    const mem = teamMembers(players, t);
    let sum = 0;
    mem.forEach(pid=>{ sum += Math.max(0, Number((taps||{})[pid])||0); });
    res[t] = {sum, n: mem.length, avg: mem.length ? sum/mem.length : 0};
  });
  const A = res[a].avg, B = res[b].avg, tot = A + B;
  res.share = tot > 0 ? A / tot : 0.5;          // a팀 쪽 비율 0~1
  res.winner = (A === B) ? 0 : (A > B ? a : b);
  return res;
}

// ── 눈치게임 판정
// alive: 참가자 pid 목록, presses: {pid: 서버시각(ms)}
// 같은 숫자 = 그 숫자를 처음 누른 사람 기준 windowMs 안에 누른 사람들 → 모두 탈락
// 한 명만 남으면 끝, 그 사람이 꼴찌 탈락 (그 뒤 누른 건 무효)
function judgeNunchi(alive, presses, windowMs){
  windowMs = windowMs || NUNCHI_WINDOW;
  const aliveSet = new Set(alive);
  const list = Object.keys(presses||{})
    .filter(pid => aliveSet.has(pid) && typeof presses[pid] === 'number')
    .map(pid => ({pid, ts: presses[pid]}))
    .sort((x,y)=> (x.ts - y.ts) || (x.pid < y.pid ? -1 : 1));
  const groups = [];
  list.forEach(p=>{
    const g = groups[groups.length-1];
    if (g && p.ts - g.first < windowMs) g.pids.push(p.pid);
    else groups.push({pids:[p.pid], first:p.ts});
  });
  let num = 0, remaining = alive.length, ended = remaining <= 1;
  const rows = [], safe = [], out = [];
  for (const g of groups){
    if (ended) break;
    num++;
    if (g.pids.length === 1){ safe.push(g.pids[0]); rows.push({num, pids:g.pids.slice(), kind:'safe'}); }
    else { g.pids.forEach(p=>out.push(p)); rows.push({num, pids:g.pids.slice(), kind:'clash'}); }
    remaining -= g.pids.length;
    if (remaining <= 1) ended = true;
  }
  const done = new Set(safe.concat(out));
  const unpressed = alive.filter(p => !done.has(p));
  return {rows, next: num + 1, safe, out, unpressed, ended, last: ended ? unpressed.slice() : []};
}

// ── 무궁화 순위: 골인 순 → 생존자 진행도 순 → 탈락자
function rankMugung(alive, prog, goal){
  const rows = alive.map(pid=>{
    const d = (prog||{})[pid] || {};
    return {pid, p: Math.min(goal, Math.max(0, Number(d.p)||0)), out: !!d.out, fin: (typeof d.fin === 'number') ? d.fin : null};
  });
  rows.sort((x,y)=>{
    const gx = x.out ? 2 : (x.fin != null ? 0 : 1), gy = y.out ? 2 : (y.fin != null ? 0 : 1);
    if (gx !== gy) return gx - gy;
    if (gx === 0) return x.fin - y.fin;
    return y.p - x.p;
  });
  let r = 0;
  rows.forEach(row=>{ row.rank = row.out ? null : ++r; });
  return rows;
}
function mugungAllDone(alive, prog){
  return alive.length > 0 && alive.every(pid=>{ const d = (prog||{})[pid] || {}; return d.out || typeof d.fin === 'number'; });
}
const MUGUNG_POINTS = [3,2,1];

// Firebase 는 배열을 객체로 돌려줄 때가 있어서 받자마자 배열로 맞춤
function asList(v){ return Array.isArray(v) ? v.filter(x => x != null) : Object.values(v || {}); }
function normState(s){
  s = s || {game:'lobby'};
  if (s.alive) s.alive = asList(s.alive);
  if (s.result) ['survivors','losers','survivorNames','loserNames','rows'].forEach(k => { if (s.result[k]) s.result[k] = asList(s.result[k]); });
  return s;
}

// 균등 랜덤 배정 (인원 차이 최대 1명)
function balancedAssign(pids, n, rnd){
  rnd = rnd || Math.random;
  const a = pids.slice();
  for (let i=a.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  const out = {};
  a.forEach((pid,i)=>{ out[pid] = (i % n) + 1; });
  return out;
}

// ── 팀 순위 공통 점수 (1·2·3위)
const TEAM_RANK_POINTS = [3,2,1];

// ── 인간 피아노
const PIANO_COLORS = [{n:'빨강',c:'#EF5A5A'},{n:'파랑',c:'#3E8EF0'},{n:'노랑',c:'#F2C744'},{n:'초록',c:'#3FB66E'},{n:'보라',c:'#B18CF2'}];
function makeSeq(len, k, rnd){
  rnd = rnd || Math.random; k = Math.max(1, Math.min(PIANO_COLORS.length, k));
  const a = [];
  for (let i=0;i<len;i++) a.push(Math.floor(rnd()*k));
  if (k > 1){ for (let c=0;c<k && c<len;c++){ if (!a.includes(c)) a[Math.floor(rnd()*len)] = c; } }  // 모든 색이 한 번은 나오게(가능하면)
  return a;
}
// 팀 진행: {pos, miss, fin(ms)} → 완주 순 → 진행 순
function rankTeamProgress(teams, prog){
  const rows = teams.map(t => { const d = (prog||{})[t] || {}; return {team:t, pos:Number(d.pos)||0, miss:Number(d.miss)||0, fin:(typeof d.fin==='number')?d.fin:null}; });
  rows.sort((x,y) => {
    if ((x.fin!=null) !== (y.fin!=null)) return x.fin!=null ? -1 : 1;
    if (x.fin!=null) return x.fin - y.fin;
    return (y.pos - x.pos) || (x.miss - y.miss);
  });
  rows.forEach((r,i) => r.rank = i+1);
  return rows;
}

// ── 릴레이 캐치마인드
const DRAW_WORDS = ['단체교섭','파업','송전탑','전봇대','변압기','정전','월급날','회식','노래방','출장','야근','워크숍','명함','악수','현수막','확성기',
  '눈사람','크리스마스트리','산타','붕어빵','군고구마','호떡','김장','스키장','펭귄','기린','코끼리','문어','라면','삼겹살','치킨','소주','등산','낚시',
  '골프','자전거','비행기','지하철','엘리베이터','우산','안경','넥타이','시계','전구','콘센트','건전지','태풍','무지개','사과나무','해바라기'];
function normAns(s){ return String(s||'').replace(/[\s.,!?~·]/g,'').toLowerCase(); }
function drawTurn(st, t){
  const order = asList(st.order), secs = (Number(st.secs)||4)*1000;
  if (!order.length || t < st.startAt) return {idx:-1, pid:null, remain:0, drawing:false};
  const i = Math.floor((t - st.startAt) / secs);
  if (i >= order.length) return {idx:order.length, pid:null, remain:0, drawing:false};
  return {idx:i, pid:order[i], remain: secs - ((t - st.startAt) % secs), drawing:true};
}
// strokes: {key:{c,w,p:"x,y;x,y"}} 좌표 0~1000
function paintStrokes(ctx, size, strokes, done){
  Object.keys(strokes||{}).sort().forEach(k => {
    if (done && done.has(k)) return;
    const s = strokes[k]; if (!s || !s.p) return;
    const pts = String(s.p).split(';').map(q => q.split(',').map(Number)).filter(q => q.length===2 && !isNaN(q[0]));
    if (!pts.length) return;
    ctx.strokeStyle = s.c || '#21242B'; ctx.lineWidth = (Number(s.w)||7) * size / 1000; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(pts[0][0]*size/1000, pts[0][1]*size/1000);
    if (pts.length === 1) ctx.lineTo(pts[0][0]*size/1000 + 0.1, pts[0][1]*size/1000);
    for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0]*size/1000, pts[i][1]*size/1000);
    ctx.stroke();
    if (done) done.add(k);
  });
}
const DRAW_PENS = [{n:'검정',c:'#21242B'},{n:'빨강',c:'#D63A2F'},{n:'파랑',c:'#2F6FD6'}];

// ── 폭탄 해체
const WIRE_COLORS = ['빨강','파랑','노랑','흰색','검정'];
const WIRE_HEX = {'빨강':'#EF5A5A','파랑':'#3E8EF0','노랑':'#F2C744','흰색':'#F5F2EA','검정':'#15161A'};
const BTN_COLORS = ['빨강','파랑','노랑','흰색'];
const BTN_LABELS = ['중단','누르기','폭발','대기'];
const KEY_COLS = [
  ['★','◇','Ω','▲','ψ','●','¶'],
  ['◆','★','¶','∞','□','Ω','ж'],
  ['△','ψ','■','ж','◇','∞','λ'],
  ['●','λ','☆','§','▲','■','※']
];
const WIRE_RULES = ['빨간 선이 하나도 없으면 → 두 번째 선','마지막 선이 흰색이면 → 마지막 선','파란 선이 두 개 이상이면 → 마지막 파란 선','노란 선이 딱 하나면 → 첫 번째 선','그 밖에는 → 세 번째 선'];
const BUTTON_RULES = ['글자가 「폭발」이면 → 꾹 누르기','빨간 버튼에 글자가 「중단」이면 → 짧게 한 번','일련번호 마지막 숫자가 짝수면 → 꾹 누르기','노란 버튼이면 → 짧게 한 번','그 밖에는 → 꾹 누르기'];
function solveWires(w){
  const n = w.length, cnt = c => w.filter(x => x===c).length;
  if (!cnt('빨강')) return 1;
  if (w[n-1] === '흰색') return n-1;
  if (cnt('파랑') >= 2) return w.lastIndexOf('파랑');
  if (cnt('노랑') === 1) return 0;
  return 2;
}
function solveButton(btn, serial){
  const last = Number(String(serial).slice(-1));
  if (btn.label === '폭발') return 'hold';
  if (btn.color === '빨강' && btn.label === '중단') return 'tap';
  if (last % 2 === 0) return 'hold';
  if (btn.color === '노랑') return 'tap';
  return 'hold';
}
function keypadOrder(keys){
  const col = KEY_COLS.find(c => keys.every(k => c.includes(k)));
  return col ? keys.slice().sort((a,b) => col.indexOf(a) - col.indexOf(b)) : keys.slice();
}
function genBomb(rnd){
  rnd = rnd || Math.random;
  const pick = a => a[Math.floor(rnd()*a.length)];
  const L = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  const serial = pick(L) + Math.floor(rnd()*10) + pick(L) + '-' + Math.floor(rnd()*10) + Math.floor(rnd()*10);
  const wires = []; const wn = 4 + Math.floor(rnd()*2);
  for (let i=0;i<wn;i++) wires.push(pick(WIRE_COLORS));
  const button = {color: pick(BTN_COLORS), label: pick(BTN_LABELS)};
  let keys;
  for (let tries=0; tries<200; tries++){
    const col = pick(KEY_COLS).slice();
    for (let i=col.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const t=col[i]; col[i]=col[j]; col[j]=t; }
    keys = col.slice(0,4);
    if (KEY_COLS.filter(c => keys.every(k => c.includes(k))).length === 1) break;
  }
  return {serial, wires, button, keys};
}
function bombMods(d){ d = d || {}; return (d.w?1:0) + (d.b?1:0) + (d.ks?1:0); }
function rankBomb(teams, prog){

function judgeMinor(alive, votes){
  const a = [], b = [], none = [];
  alive.forEach(pid => { const v = (votes||{})[pid]; (v==='a' ? a : v==='b' ? b : none).push(pid); });
  let survivors, tie = false;
  if (!a.length && !b.length) survivors = [];
  else if (!a.length) survivors = b.slice();
  else if (!b.length) survivors = a.slice();
  else if (a.length === b.length){ survivors = a.concat(b); tie = true; }
  else survivors = (a.length < b.length ? a : b).slice();
  const sset = new Set(survivors);
  return {a, b, none, survivors, out: alive.filter(p => !sset.has(p)), tie};
}

const CHICKEN_STEP = 250;
function chickenValue(startAt, t){ return Math.max(0, Math.floor((t - startAt) / CHICKEN_STEP)); }
function rankChicken(alive, data, startAt, explodeAt){
  const rows = alive.map(pid => { const ts = (data||{})[pid]; const ok = typeof ts==='number' && ts < explodeAt; return {pid, v: ok ? chickenValue(startAt, ts) : 0, locked: typeof ts==='number', boom: !ok}; });

  let r = 0; rows.forEach(x => x.rank = x.v > 0 ? ++r : null);
  return rows;
}

function enneaScore(ans){
  ans = ans || {};
  const by = {}, mx = {};
  ENNEA_ITEMS.forEach(it => { const v = Number(ans[it.id]); if (v >= 1 && v <= 5){ (by[it.t] = by[it.t] || []).push(v); mx[it.t] = Math.max(mx[it.t] || 0, v); } });

  const scores = {};
  for (let t=1;t<=9;t++){ const a = by[t] || []; scores[t] = a.length ? a.reduce((x,y)=>x+y,0) / a.length * 2 : 0; }
  let type = null;
  if (n >= 6){
    type = 1;
    for (let t=2;t<=9;t++){
      if (scores[t] > scores[type] || (scores[t] === scores[type] && (mx[t]||0) > (mx[type]||0))) type = t;
    }
  }
  const cs = [0,1,2].map(c => [1,2,3,4,5,6,7,8,9].filter(t => ENNEA_CENTER[t] === c).reduce((a,t) => a + scores[t], 0) / 3);
  return {scores, type, center: type ? ENNEA_CENTER[type] : null, cs, answered: n};
}
function seededShuffle(arr, seedStr){
  let h = 2166136261; for (const ch of String(seedStr)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  const rnd = () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); const x = a[i]; a[i] = a[j]; a[j] = x; }
  return a;
}
// 섞기: 정원(인원 차 최대 1명) 안에서, 그 중심(장·가슴·머리)이 가장 적은 팀 → 같은 유형이 적은 팀 → 인원 적은 팀 순으로 배정
function enneaMix(people, n, rnd){
  rnd = rnd || Math.random;
  const N = people.length, cap = [];
  for (let t=1;t<=n;t++) cap[t] = Math.floor(N / n) + (t <= N % n ? 1 : 0);
  const typed = people.filter(p => p.type).map(p => ({...p, k: rnd()})).sort((x,y) => (x.center - y.center) || (x.type - y.type) || (x.k - y.k));
  const rest = people.filter(p => !p.type).map(p => ({...p, k: rnd()})).sort((x,y) => x.k - y.k);
  const out = {}, size = {}, cc = {}, tc = {};
  for (let t=1;t<=n;t++){ size[t] = 0; cc[t] = [0,0,0]; tc[t] = {}; }
  typed.concat(rest).forEach(p => {
    let best = null;
    for (let t=1;t<=n;t++){
      if (size[t] >= cap[t]) continue;
      const key = [p.type ? cc[t][p.center] : 0, p.type ? (tc[t][p.type] || 0) : 0, size[t], rnd()];
      if (!best || key[0] < best.key[0] || (key[0] === best.key[0] && (key[1] < best.key[1] || (key[1] === best.key[1] && (key[2] < best.key[2] || (key[2] === best.key[2] && key[3] < best.key[3])))))) best = {t, key};
    }
    out[p.pid] = best.t; size[best.t]++;
    if (p.type){ cc[best.t][p.center]++; tc[best.t][p.type] = (tc[best.t][p.type] || 0) + 1; }
  });
  return {teams: out, scouted: {}};
}
// 모으기(3팀): 장형=1팀, 가슴형=2팀, 머리형=3팀. 넘치면 다른 중심 점수가 가장 가까운 사람을 옮김
function enneaGroup(people, rnd){
  rnd = rnd || Math.random;
  const N = people.length, base = Math.floor(N / 3), extra = N % 3;
  const natural = [0,1,2].map(c => people.filter(p => p.type && p.center === c).length);
  const order = [0,1,2].sort((a,b) => natural[b] - natural[a]);
  const cap = [base, base, base]; order.slice(0, extra).forEach(c => cap[c]++);
  const team = {}, scouted = {};
  people.forEach(p => { if (p.type) team[p.pid] = p.center; });
  const count = c => Object.values(team).filter(x => x === c).length;
  people.filter(p => !p.type).map(p => ({p, k: rnd()})).sort((a,b) => a.k - b.k).forEach(({p}) => {
    const under = [0,1,2].filter(c => count(c) < cap[c]);
    team[p.pid] = under.length ? under[0] : [0,1,2].sort((a,b) => count(a) - count(b))[0];
  });
  for (let guard = 0; guard < 100; guard++){
    const over = [0,1,2].filter(c => count(c) > cap[c]), under = [0,1,2].filter(c => count(c) < cap[c]);
    if (!over.length || !under.length) break;
    let best = null;
    people.forEach(p => {
      if (!over.includes(team[p.pid])) return;
      under.forEach(u => {
        const own = p.cs ? p.cs[team[p.pid]] : 0, tgt = p.cs ? p.cs[u] : 0;
        const cost = own - tgt + rnd() * 1e-6;
        if (!best || cost < best.cost) best = {pid: p.pid, to: u, cost};
      });
    });
    if (!best) break;
    team[best.pid] = best.to; scouted[best.pid] = best.to + 1;
  }
  const out = {}; Object.keys(team).forEach(pid => out[pid] = team[pid] + 1);
  return {teams: out, scouted};
}

async function sha256(s){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

}

    case 'minorOpen': openMinor(); break;
    case 'minorClose': update(R('state/q'), {closeAt: now() - 801}); break;
    case 'minorEnd': finalizeMinor(); break;
    case 'chickenStart': startChicken(); break;
  }
}

function ensureLightDriver(){
  if (ST.game !== 'mugung' || ST.phase !== 'live' || !autoLight){ clearLight(); return; }

  const t = now();
  const from = Math.max(t, ST.startAt || t);

// ── 점수 반영 (한 번만)
async function applyResult(){
  const r = ST.result || {};
  if (r.applied) return;
  const u = {}, add = (path, n) => { u[path] = (u[path] || 0) + n; };
  let text = '';
  if (r.kind === 'tug' && r.winner){
    add('scores/team/' + r.winner, pts.tug);
    text = '줄다리기 ' + teamName(cfg, r.winner) + ' +' + pts.tug;
  } else if (r.kind === 'nunchi'){
    (r.survivors||[]).forEach(pid => {
      add('scores/player/' + pid, pts.nunchi);
      const t = players[pid] && Number(players[pid].team);
      if (t) add('scores/team/' + t, pts.nunchi);
    });
    text = '눈치게임 생존 ' + (r.survivors||[]).length + '명 +' + pts.nunchi;
  } else if (r.kind === 'mugung'){
    (r.rows||[]).forEach(x => {
      if (!x.rank || x.rank > 3) return;
      const n = MUGUNG_POINTS[x.rank - 1];
      add('scores/player/' + x.pid, n);
      const t = players[x.pid] && Number(players[x.pid].team);
      if (t) add('scores/team/' + t, n);
    });
    text = '무궁화 1~3등';
  } else if (r.kind === 'piano' || r.kind === 'bomb'){
    asList(r.rows).forEach(x => {
      const ok = r.kind === 'piano' ? (x.fin != null || x.pos > 0) : x.mods > 0;
      if (ok && x.rank <= 3) add('scores/team/' + x.team, TEAM_RANK_POINTS[x.rank - 1]);
    });
    text = GAME_TITLES[r.kind] + ' 팀 순위';
  } else if (r.kind === 'draw' && r.correct){
    add('scores/team/' + r.correct.team, 2);
    add('scores/team/' + r.team, 1);
    text = '캐치마인드 ' + r.word;
  } else if (r.kind === 't10' || r.kind === 'chicken'){
    asList(r.rows).forEach(x => {
      if (!x.rank || x.rank > 3) return;
      const n = MUGUNG_POINTS[x.rank - 1];
      add('scores/player/' + x.pid, n);
      const t = players[x.pid] && Number(players[x.pid].team);
      if (t) add('scores/team/' + t, n);
    });
    text = GAME_TITLES[r.kind] + ' 1~3등';
  } else if (r.kind === 'minor'){
    asList(r.survivors).forEach(pid => {
      add('scores/player/' + pid, pts.minor);
      const t = players[pid] && Number(players[pid].team);
      if (t) add('scores/team/' + t, pts.minor);
    });
    text = '소수파 생존 ' + asList(r.survivors).length + '명';
  } else return;
  const out = {};
  Object.keys(u).forEach(k => out[k] = increment(u[k]));
  out['state/result/applied'] = true;
  out['log/' + push(R('log')).key] = {at: serverTimestamp(), text};
  await update(ref(db, ROOT), out);
}

// ── 릴레이 캐치마인드
let drawTeam = 0, drawWord = '', drawSecs = 4;
const usedWords = new Set();
function pickWord(){ const pool = DRAW_WORDS.filter(w => !usedWords.has(w)); drawWord = (pool.length ? pool : DRAW_WORDS)[Math.floor(Math.random() * (pool.length || DRAW_WORDS.length))]; }

  if (ST.phase === 'live'){

  }

function startDraw(){
  const mem = teamMembers(players, drawTeam).slice();
  for (let i = mem.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const t = mem[i]; mem[i] = mem[j]; mem[j] = t; }
  const startAt = now() + COUNTDOWN_MS;
  usedWords.add(drawWord);
  setState({game:'draw', phase:'live', round: newRound(), team: drawTeam, word: drawWord, order: mem, secs: drawSecs, startAt, guessEnd: startAt + mem.length * drawSecs * 1000 + 20000});
  const teams = activeTeams(); drawTeam = teams[(teams.indexOf(drawTeam) + 1) % teams.length] || drawTeam; pickWord();
}
async function finalizeDraw(correct){
  if (finalizing || ST.phase !== 'live') return; finalizing = true;
  try{
    await update(R('state'), {phase:'result', result:{kind:'draw', team: ST.team, word: ST.word, correct: correct || null, applied:false}});
  }catch(e){ finalizing = false; console.warn(e); }
}
let hdDrawn = new Set(), hdRound = '';
function tickDrawHost(){
  const cv = $('hdCv'); if (!cv) return;
  if (!cv.width || hdRound !== ST.round || cv.dataset.r !== ST.round){ const w = cv.clientWidth || 300; cv.width = w * 2; cv.height = w * 2; cv.style.height = w + 'px'; cv.dataset.r = ST.round; hdDrawn = new Set(); hdRound = ST.round; }
  paintStrokes(cv.getContext('2d'), cv.width, (play||{}).strokes, hdDrawn);
  const t = now(), turn = drawTurn(ST, t);
  $('hdTime').textContent = t < ST.startAt ? '준비' : (turn.drawing ? Math.ceil(turn.remain/1000) + '초' : '맞히기 ' + Math.max(0, Math.ceil((ST.guessEnd - t)/1000)) + '초');
  $('hdWho').textContent = turn.drawing ? '그리는 중: ' + playerName(players, turn.pid) + ' (' + (turn.idx+1) + '/' + asList(ST.order).length + ')' : (t < ST.startAt ? '곧 시작' : '그리기 끝 · 맞히는 중');
  const gs = Object.keys((play||{}).guesses || {}).sort().map(k => play.guesses[k]).filter(Boolean);
  const ans = normAns(ST.word);
  $('hdFeed').innerHTML = gs.slice(-8).reverse().map(g => `<div class="row"><span class="dot" style="background:${teamColor(g.team)}"></span><span style="font-weight:700">${esc(playerName(players,g.pid))}</span>

  const hit = gs.filter(g => g.team && Number(g.team) !== Number(ST.team) && normAns(g.text) === ans).sort((a,b) => (a.at||0) - (b.at||0))[0];

}

  const rows = rankBomb(teams, play);
  el.innerHTML = rows.map(r => `<div class="row"><span class="dot" style="background:${teamColor(r.team)}"></span><span style="flex:1;font-weight:700">${esc(teamName(cfg,r.team))}<span class="muted"> · 담당 ${esc(playerName(players, ST.bombers[r.team]))}</span></span>
    <span class="muted">${r.at != null ? '해체 ' + fmtSec2(r.at) + '초' : (r.exploded ? '펑!' : r.mods + '/3 · 실수 ' + r.strikes)}</span></div>`).join('');
  if (t > ST.startAt && (rows.every(r => r.at != null || r.exploded) || t > ST.endAt + 1000)) finalizeBomb();
}

// ── 개인전 공통: 시작/결과
function soloStartBtn(act){
  const n = Object.keys(players).length;
  return `<button class="btn ${ST.phase==='result'?'ghost':'main'}" data-act="${act}" ${n?'':'disabled'}>${ST.phase==='result'?'한 판 더':'시작'} (접속 ${n}명 전원)</button>`;
}
function soloRows(rows, fmt){
  return `<div class="card">${rows.map(x => `<div class="row"><span class="num">${x.rank || '-'}</span><span style="flex:1;font-weight:700">${esc(x.name)}</span><span class="muted">${fmt(x)}</span></div>`).join('')}</div>`;
}

// ── 10초 맞히기
function t10Panel(){
  if (ST.phase === 'live') return `<div class="card"><div class="gl"><span style="color:var(--gold)">진행 중</span><span class="muted" id="htInfo"></span></div><div id="htList"></div></div>
    <button class="btn main" data-act="t10End">지금 끝내기</button>`;
  if (ST.phase === 'result'){
    const rows = asList((ST.result||{}).rows);
    return soloRows(rows, x => x.ms != null ? fmtSec2(x.ms) + '초 (오차 ' + fmtSec2(x.err) + ')' : '안 누름') +
      (rows.some(x => x.rank) ? applyBtn('점수 반영: 1·2·3등 +3 / +2 / +1 (개인 + 그 팀)') : '') + soloStartBtn('t10Start');
  }
  return `<div class="card"><div style="font-size:20px;font-weight:900">10초 맞히기</div><div class="muted" style="margin-top:4px">다 같이 시작해서 3초 뒤 숫자가 사라져요. 딱 10초에 멈춘 사람이 1등.</div></div>${soloStartBtn('t10Start')}`;
}
function startT10(){ setState({game:'t10', phase:'live', round: newRound(), startAt: now() + COUNTDOWN_MS, alive: Object.keys(players)}); }
async function finalizeT10(){
  if (finalizing || ST.phase !== 'live') return; finalizing = true;
  try{
    const data = (await get(R('play/t10/' + ST.round))).val() || {};
    const rows = rankT10(asList(ST.alive), data).map(x => ({pid:x.pid, name: playerName(players,x.pid), ms:x.ms, err:x.err, rank:x.rank}));
    await update(R('state'), {phase:'result', result:{kind:'t10', rows, applied:false}});
  }catch(e){ finalizing = false; console.warn(e); }
}
function tickT10Host(){
  const el = $('htList'); if (!el) return;
  const t = now(), alive = asList(ST.alive);
  const done = alive.filter(p => typeof play[p] === 'number');
  $('htInfo').textContent = t < ST.startAt ? '준비' : '누른 사람 ' + done.length + ' / ' + alive.length + ' · ' + fmtSec2(t - ST.startAt) + '초';
  el.innerHTML = done.sort((a,b) => play[a] - play[b]).map(p => `<div class="row"><span style="flex:1;font-weight:700">${esc(playerName(players,p))}</span><span class="muted">${fmtSec2(play[p])}초</span></div>`).join('') || '<div class="muted">아직 없음</div>';
  if (t > ST.startAt && (done.length === alive.length || t > ST.startAt + 25000)) finalizeT10();
}

// ── 소수파 생존
let minorIdx = 0;
pts.minor = 2;
function minorBuilder(){
  const [a, b] = MINOR_PRESETS[minorIdx % MINOR_PRESETS.length];
  return `<div class="card"><div class="gl"><span style="color:var(--gold)">다음 질문</span><button class="sm" data-act="minorNext">다른 질문</button></div>
    <div class="grid2"><input class="field" data-custom="ma" maxlength="12" value="${esc(a)}" aria-label="보기 A"><input class="field" data-custom="mb" maxlength="12" value="${esc(b)}" aria-label="보기 B"></div>
    <button class="btn main" data-act="minorOpen" style="margin-top:10px">질문 열기 (10초)</button></div>`;
}
function minorPanel(){
  const n = Object.keys(players).length;
  if (ST.phase === 'live'){
    const q = ST.q, alive = asList(ST.alive);
    let body = `<div class="card"><div class="gl"><span style="color:var(--gold)">생존 ${alive.length}명</span><span class="muted">${q ? q.n + '번째 질문' : '첫 질문 전'}</span></div>
      <div class="muted">${alive.map(p => esc(playerName(players,p))).join(' · ')}</div></div>`;
    if (q && !q.closed){
      body += `<div class="card"><div style="font-size:22px;font-weight:900">${esc(q.a)} vs ${esc(q.b)}</div><div class="big" id="hmTime" style="font-size:44px"></div><div class="muted center" id="hmCount"></div></div>
        <button class="btn ghost" data-act="minorClose">지금 마감</button>`;
    } else {
      if (q && q.closed){
        const r = q.res || {};
        body += `<div class="card"><div style="font-weight:700">${esc(q.a)} ${r.aN}명 vs ${esc(q.b)} ${r.bN}명${r.noneN ? ' · 안 고름 ' + r.noneN + '명' : ''}</div>
          <div style="font-size:20px;font-weight:900;margin-top:4px">${r.tie ? '동점 — 모두 생존' : esc(r.winLabel) + ' 생존 ' + asList(r.survivors).length + '명'}</div></div>`;
      }
      const left = q && q.closed ? asList((q.res||{}).survivors).length : alive.length;
      body += left > 1 ? minorBuilder() : `<div class="card muted" style="color:var(--gold)">${left === 1 ? '한 명 남았어요. 끝내기를 누르세요' : '남은 사람이 없어요. 끝내기를 누르세요'}</div>`;
      body += `<button class="btn ghost" data-act="minorEnd">끝내기 (지금 생존자 확정)</button>`;
    }
    return body;
  }
  if (ST.phase === 'result'){
    const r = ST.result || {};
    return `<div class="card"><div class="sec-t">최종 생존 ${asList(r.survivors).length}명</div><div style="font-weight:700">${asList(r.survivorNames).map(esc).join(' · ') || '없음'}</div></div>
      ${stepper('minor', '생존자 1명당 (개인 + 그 팀)')}
      ${asList(r.survivors).length ? applyBtn('점수 반영: 생존자 +' + pts.minor) : ''}
      <button class="btn ghost" data-act="minorStart" ${n?'':'disabled'}>새 게임 (전원 부활)</button>`;
  }
  return `<div class="card"><div style="font-size:20px;font-weight:900">소수파 생존</div><div class="muted" style="margin-top:4px">질문마다 둘 중 하나. 적게 고른 쪽만 살아남아요. 2~3명 남을 때까지 반복.</div></div>
    <button class="btn main" data-act="minorStart" ${n?'':'disabled'}>시작 (접속 ${n}명 전원)</button>`;
}
function startMinor(){ setState({game:'minor', phase:'live', round: newRound(), alive: Object.keys(players), q: null}); }
function openMinor(){
  const a = ($('main').querySelector('[data-custom=ma]') || {}).value || MINOR_PRESETS[minorIdx % MINOR_PRESETS.length][0];
  const b = ($('main').querySelector('[data-custom=mb]') || {}).value || MINOR_PRESETS[minorIdx % MINOR_PRESETS.length][1];
  const q = ST.q;
  const alive = q && q.closed ? asList((q.res||{}).survivors) : asList(ST.alive);
  minorIdx++;
  update(R('state'), {alive, q: {n: (q ? q.n : 0) + 1, a: a.trim().slice(0,12), b: b.trim().slice(0,12), closeAt: now() + 10000, closed: false}});
}
async function closeMinor(){
  const q = ST.q; if (!q || q.closed || finalizing) return; finalizing = true;
  try{
    const votes = (await get(R('play/minor/' + ST.round + '/q' + q.n))).val() || {};
    const alive = asList(ST.alive), j = judgeMinor(alive, votes);
    const winLabel = j.tie ? '' : (j.a.length && (!j.b.length || j.a.length < j.b.length) ? q.a : q.b);
    await update(R('state/q'), {closed: true, closeAt: Math.min(q.closeAt, now()), res: {aN: j.a.length, bN: j.b.length, noneN: j.none.length, survivors: j.survivors, voters: alive, tie: j.tie, winLabel}});
  }catch(e){ console.warn(e); }
  finalizing = false;
}
async function finalizeMinor(){
  if (finalizing || ST.phase !== 'live') return; finalizing = true;
  try{
    const q = ST.q;
    const surv = q && q.closed ? asList((q.res||{}).survivors) : asList(ST.alive);
    await update(R('state'), {phase:'result', result:{kind:'minor', survivors: surv, survivorNames: surv.map(p => playerName(players,p)), applied:false}});
  }catch(e){ finalizing = false; console.warn(e); }
}
function tickMinorHost(){
  const q = ST.q; const el = $('hmTime'); if (!q || !el) return;
  const t = now();
  el.textContent = Math.max(0, Math.ceil((q.closeAt - t)/1000));
  const votes = (play||{})['q' + q.n] || {}, alive = asList(ST.alive);
  const a = alive.filter(p => votes[p] === 'a').length, b = alive.filter(p => votes[p] === 'b').length;
  $('hmCount').textContent = '고른 사람 ' + (a + b) + ' / ' + alive.length + '명 (비율은 마감 후 공개)';
  if (t > q.closeAt + 800) closeMinor();
}

// ── 치킨 버튼
function chickenPanel(){
  if (ST.phase === 'live') return `<div class="card"><div class="big" id="hcPot" style="font-size:72px;color:var(--gold)">0</div><div class="muted center">언제 터질지는 사회자도 몰라요 (8~25초 사이)</div></div>
    <div class="card"><div class="sec-t">챙긴 사람</div><div id="hcList"></div></div>`;
  if (ST.phase === 'result'){
    const rows = asList((ST.result||{}).rows);
    return soloRows(rows, x => x.v ? x.v + '점' : '펑 0점') +
      (rows.some(x => x.rank) ? applyBtn('점수 반영: 1·2·3등 +3 / +2 / +1 (개인 + 그 팀)') : '') + soloStartBtn('chickenStart');
  }
  return `<div class="card"><div style="font-size:20px;font-weight:900">치킨 버튼</div><div class="muted" style="margin-top:4px">점수가 0.25초마다 1점씩 올라가요. 터지기 전에 챙긴 점수가 높은 순으로 1·2·3등.</div></div>${soloStartBtn('chickenStart')}`;
}
function startChicken(){
  const startAt = now() + COUNTDOWN_MS;
  setState({game:'chicken', phase:'live', round: newRound(), startAt, explodeAt: startAt + Math.round(rand(8000, 25000)), alive: Object.keys(players)});
}
async function finalizeChicken(){
  if (finalizing || ST.phase !== 'live') return; finalizing = true;
  try{
    const data = (await get(R('play/chicken/' + ST.round))).val() || {};
    const rows = rankChicken(asList(ST.alive), data, ST.startAt, ST.explodeAt).map(x => ({pid:x.pid, name: playerName(players,x.pid), v:x.v, rank:x.rank}));
    await update(R('state'), {phase:'result', result:{kind:'chicken', rows, applied:false}});
  }catch(e){ finalizing = false; console.warn(e); }
}
function tickChickenHost(){
  const el = $('hcPot'); if (!el) return;
  const t = now(), boom = t >= ST.explodeAt;
  el.textContent = t < ST.startAt ? '준비' : (boom ? '펑!' : chickenValue(ST.startAt, t));
  const list = Object.keys(play||{}).filter(p => typeof play[p] === 'number' && play[p] < ST.explodeAt).sort((a,b) => play[b] - play[a]);
  $('hcList').innerHTML = list.map(p => `<div class="row"><span style="flex:1;font-weight:700">${esc(playerName(players,p))}</span><b>${chickenValue(ST.startAt, play[p])}점</b></div>`).join('') || '<div class="muted">아직 없음</div>';
  if (t > ST.explodeAt + 1500) finalizeChicken();
}

// ── 진행 중 실시간 갱신
function tick(){
  if (!started || TAB !== 'run' || ST.phase !== 'live') return;
  const t = now();
  if (ST.game === 'tug'){
    const el = $('tugTimer'); if (!el) return;
    el.textContent = t < ST.startAt ? '준비' : (t <= ST.endAt ? Math.max(0, Math.ceil((ST.endAt - t)/1000)) : '집계');
    const s = tugStats(players, play, ST.a, ST.b);
    $('tugFill').style.width = (s.share*100).toFixed(1) + '%';
    $('tugA').textContent = '평균 ' + s[ST.a].avg.toFixed(1) + ' · 합계 ' + s[ST.a].sum;
    $('tugB').textContent = '평균 ' + s[ST.b].avg.toFixed(1) + ' · 합계 ' + s[ST.b].sum;
    $('tugInfo').textContent = teamMembers(players,ST.a).length + '명 vs ' + teamMembers(players,ST.b).length + '명';
    if (t > ST.endAt + 1500) finalizeTug();
  }
  if (ST.game === 'nunchi'){
    const el = $('nNext'); if (!el) return;
    const j = judgeNunchi(ST.alive || [], play);
    el.textContent = t < ST.startAt ? '준비' : (j.ended ? '끝' : j.next);
    $('nLeft').textContent = '안 누른 사람 ' + j.unpressed.length + '명';
    $('nList').innerHTML = j.rows.map(r => `<div class="row"><span class="num" style="${r.kind==='clash'?'color:var(--accent)':''}">${r.num}</span>
      <span style="flex:1;font-weight:700" class="${r.kind==='clash'?'strike':''}">${r.pids.map(p => esc(playerName(players,p))).join(' · ')}</span>${r.kind==='clash'?'<span class="muted">동시 탈락</span>':''}</div>`).join('');
    if (j.ended){ if (!ST._endSeen){ ST._endSeen = t; } if (t - ST._endSeen > 900) finalizeNunchi(); }
  }
  if (ST.game === 'mugung'){
    const el = $('mLight'); if (!el) return;
    const red = ST.light === 'red';
    el.textContent = t < ST.startAt ? '준비' : (red ? '빨간불' : '초록불');
    el.style.background = t < ST.startAt ? 'var(--line)' : (red ? '#A8231C' : '#1E7A4C');
    const rows = rankMugung(ST.alive || [], play, ST.goal);
    $('mInfo').textContent = '골인 ' + rows.filter(r => r.fin != null).length + ' · 탈락 ' + rows.filter(r => r.out).length + ' / ' + rows.length + '명';
    $('mList').innerHTML = rows.map(r => `<div class="row"><span class="num">${r.rank||'-'}</span><span style="flex:1;font-weight:700" class="${r.out?'strike':''}">${esc(playerName(players,r.pid))}</span>
      <span class="muted">${r.out?'탈락':(r.fin!=null?'골인':r.p+'/'+ST.goal)}</span></div>`).join('');
    if (t > ST.startAt && (mugungAllDone(ST.alive || [], play) || t > ST.startAt + 120000)) finalizeMugung();
  }
  if (ST.game === 'ennea') tickEnneaHost();
  if (ST.game === 'piano') tickPianoHost();
  if (ST.game === 'draw') tickDrawHost();
  if (ST.game === 'bomb') tickBombHost();
  if (ST.game === 't10') tickT10Host();
  if (ST.game === 'minor') tickMinorHost();
  if (ST.game === 'chicken') tickChickenHost();
}
</script>
</body>
</html>
