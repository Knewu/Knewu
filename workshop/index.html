<!DOCTYPE html>

<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;background:var(--navy);color:var(--ivory);

header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid rgba(245,242,234,.15)}

.h-title{font-size:16px;font-weight:900;margin-top:2px}

main{max-width:480px;margin:0 auto;padding:18px 16px 32px;display:flex;flex-direction:column;gap:14px;min-height:calc(100dvh - 68px)}

<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue, update, serverTimestamp, runTransaction, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyB186Tg9fsrnR-K_lufo4X5iY9OVpgDeHk",
  authDomain: "knewu24th-15ebc.firebaseapp.com",

};
const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const db = getDatabase(app);

// ===== 공통 (host / index / board 동일) =====
const ROOT = 'workshop_2026';
const TEAM_COLORS = {1:'#E8623A',2:'#58A6F0',3:'#F2B544',4:'#3FC1A0'};
const DEFAULT_TEAM_NAMES = {1:'1팀',2:'2팀',3:'3팀',4:'4팀'};
const NUNCHI_WINDOW = 300;   // ms 안에 같이 누르면 동시
const MUGUNG_GRACE = 250;    // 빨간불 받은 직후 봐주는 시간(ms)
const TUG_SECONDS = 10;
const COUNTDOWN_MS = 3500;
const GAME_TITLES = {lobby:'대기', tug:'폰 줄다리기', nunchi:'눈치게임', mugung:'무궁화 꽃이 피었습니다',
  ennea:'에니어그램 팀 짜기', piano:'인간 피아노', draw:'릴레이 캐치마인드', bomb:'폭탄 해체', t10:'10초 맞히기', minor:'소수파 생존', chicken:'치킨 버튼'};
const PLAY_GAMES = ['ennea','tug','nunchi','mugung','piano','draw','bomb','t10','minor','chicken'];

function esc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function teamName(cfg, t){ return (cfg && cfg.teamNames && cfg.teamNames[t]) || DEFAULT_TEAM_NAMES[t] || '미배정'; }
function teamColor(t){ return TEAM_COLORS[t] || '#2C4176'; }
function teamCount(cfg){ const n = cfg && Number(cfg.teamCount); return (n===4) ? 4 : 3; }
function teamList(cfg){ const n = teamCount(cfg); const a=[]; for(let i=1;i<=n;i++) a.push(i); return a; }
function playerName(players, pid){ return (players && players[pid] && players[pid].name) || '(나감)'; }
function teamMembers(players, t){
  return Object.keys(players||{}).filter(pid => players[pid] && Number(players[pid].team) === t)
    .sort((x,y)=> (players[x].at||0) - (players[y].at||0));
}

// ── 줄다리기: 팀 평균 연타수로 비교 (인원 다른 팀도 공정)
function tugStats(players, taps, a, b){
  const res = {};
  [a,b].forEach(t=>{
    const mem = teamMembers(players, t);
    let sum = 0;
    mem.forEach(pid=>{ sum += Math.max(0, Number((taps||{})[pid])||0); });
    res[t] = {sum, n: mem.length, avg: mem.length ? sum/mem.length : 0};
  });
  const A = res[a].avg, B = res[b].avg, tot = A + B;
  res.share = tot > 0 ? A / tot : 0.5;          // a팀 쪽 비율 0~1
  res.winner = (A === B) ? 0 : (A > B ? a : b);
  return res;
}

// ── 눈치게임 판정
// alive: 참가자 pid 목록, presses: {pid: 서버시각(ms)}
// 같은 숫자 = 그 숫자를 처음 누른 사람 기준 windowMs 안에 누른 사람들 → 모두 탈락
// 한 명만 남으면 끝, 그 사람이 꼴찌 탈락 (그 뒤 누른 건 무효)
function judgeNunchi(alive, presses, windowMs){
  windowMs = windowMs || NUNCHI_WINDOW;
  const aliveSet = new Set(alive);
  const list = Object.keys(presses||{})
    .filter(pid => aliveSet.has(pid) && typeof presses[pid] === 'number')
    .map(pid => ({pid, ts: presses[pid]}))
    .sort((x,y)=> (x.ts - y.ts) || (x.pid < y.pid ? -1 : 1));
  const groups = [];
  list.forEach(p=>{
    const g = groups[groups.length-1];
    if (g && p.ts - g.first < windowMs) g.pids.push(p.pid);
    else groups.push({pids:[p.pid], first:p.ts});
  });
  let num = 0, remaining = alive.length, ended = remaining <= 1;
  const rows = [], safe = [], out = [];
  for (const g of groups){
    if (ended) break;
    num++;
    if (g.pids.length === 1){ safe.push(g.pids[0]); rows.push({num, pids:g.pids.slice(), kind:'safe'}); }
    else { g.pids.forEach(p=>out.push(p)); rows.push({num, pids:g.pids.slice(), kind:'clash'}); }
    remaining -= g.pids.length;
    if (remaining <= 1) ended = true;
  }
  const done = new Set(safe.concat(out));
  const unpressed = alive.filter(p => !done.has(p));
  return {rows, next: num + 1, safe, out, unpressed, ended, last: ended ? unpressed.slice() : []};
}

// ── 무궁화 순위: 골인 순 → 생존자 진행도 순 → 탈락자
function rankMugung(alive, prog, goal){
  const rows = alive.map(pid=>{
    const d = (prog||{})[pid] || {};
    return {pid, p: Math.min(goal, Math.max(0, Number(d.p)||0)), out: !!d.out, fin: (typeof d.fin === 'number') ? d.fin : null};
  });
  rows.sort((x,y)=>{
    const gx = x.out ? 2 : (x.fin != null ? 0 : 1), gy = y.out ? 2 : (y.fin != null ? 0 : 1);
    if (gx !== gy) return gx - gy;
    if (gx === 0) return x.fin - y.fin;
    return y.p - x.p;
  });
  let r = 0;
  rows.forEach(row=>{ row.rank = row.out ? null : ++r; });
  return rows;
}
function mugungAllDone(alive, prog){
  return alive.length > 0 && alive.every(pid=>{ const d = (prog||{})[pid] || {}; return d.out || typeof d.fin === 'number'; });
}
const MUGUNG_POINTS = [3,2,1];

// Firebase 는 배열을 객체로 돌려줄 때가 있어서 받자마자 배열로 맞춤
function asList(v){ return Array.isArray(v) ? v.filter(x => x != null) : Object.values(v || {}); }
function normState(s){
  s = s || {game:'lobby'};
  if (s.alive) s.alive = asList(s.alive);
  if (s.result) ['survivors','losers','survivorNames','loserNames','rows'].forEach(k => { if (s.result[k]) s.result[k] = asList(s.result[k]); });
  return s;
}

// 균등 랜덤 배정 (인원 차이 최대 1명)
function balancedAssign(pids, n, rnd){
  rnd = rnd || Math.random;
  const a = pids.slice();
  for (let i=a.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  const out = {};
  a.forEach((pid,i)=>{ out[pid] = (i % n) + 1; });
  return out;
}

// ── 팀 순위 공통 점수 (1·2·3위)
const TEAM_RANK_POINTS = [3,2,1];

// ── 인간 피아노
const PIANO_COLORS = [{n:'빨강',c:'#EF5A5A'},{n:'파랑',c:'#3E8EF0'},{n:'노랑',c:'#F2C744'},{n:'초록',c:'#3FB66E'},{n:'보라',c:'#B18CF2'}];
function makeSeq(len, k, rnd){
  rnd = rnd || Math.random; k = Math.max(1, Math.min(PIANO_COLORS.length, k));
  const a = [];
  for (let i=0;i<len;i++) a.push(Math.floor(rnd()*k));
  if (k > 1){ for (let c=0;c<k && c<len;c++){ if (!a.includes(c)) a[Math.floor(rnd()*len)] = c; } }  // 모든 색이 한 번은 나오게(가능하면)
  return a;
}
// 팀 진행: {pos, miss, fin(ms)} → 완주 순 → 진행 순
function rankTeamProgress(teams, prog){
  const rows = teams.map(t => { const d = (prog||{})[t] || {}; return {team:t, pos:Number(d.pos)||0, miss:Number(d.miss)||0, fin:(typeof d.fin==='number')?d.fin:null}; });
  rows.sort((x,y) => {
    if ((x.fin!=null) !== (y.fin!=null)) return x.fin!=null ? -1 : 1;
    if (x.fin!=null) return x.fin - y.fin;
    return (y.pos - x.pos) || (x.miss - y.miss);
  });
  rows.forEach((r,i) => r.rank = i+1);
  return rows;
}

// ── 릴레이 캐치마인드
const DRAW_WORDS = ['단체교섭','파업','송전탑','전봇대','변압기','정전','월급날','회식','노래방','출장','야근','워크숍','명함','악수','현수막','확성기',
  '눈사람','크리스마스트리','산타','붕어빵','군고구마','호떡','김장','스키장','펭귄','기린','코끼리','문어','라면','삼겹살','치킨','소주','등산','낚시',
  '골프','자전거','비행기','지하철','엘리베이터','우산','안경','넥타이','시계','전구','콘센트','건전지','태풍','무지개','사과나무','해바라기'];
function normAns(s){ return String(s||'').replace(/[\s.,!?~·]/g,'').toLowerCase(); }
function drawTurn(st, t){
  const order = asList(st.order), secs = (Number(st.secs)||4)*1000;
  if (!order.length || t < st.startAt) return {idx:-1, pid:null, remain:0, drawing:false};
  const i = Math.floor((t - st.startAt) / secs);
  if (i >= order.length) return {idx:order.length, pid:null, remain:0, drawing:false};
  return {idx:i, pid:order[i], remain: secs - ((t - st.startAt) % secs), drawing:true};
}
// strokes: {key:{c,w,p:"x,y;x,y"}} 좌표 0~1000
function paintStrokes(ctx, size, strokes, done){
  Object.keys(strokes||{}).sort().forEach(k => {
    if (done && done.has(k)) return;
    const s = strokes[k]; if (!s || !s.p) return;
    const pts = String(s.p).split(';').map(q => q.split(',').map(Number)).filter(q => q.length===2 && !isNaN(q[0]));
    if (!pts.length) return;
    ctx.strokeStyle = s.c || '#21242B'; ctx.lineWidth = (Number(s.w)||7) * size / 1000; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(pts[0][0]*size/1000, pts[0][1]*size/1000);
    if (pts.length === 1) ctx.lineTo(pts[0][0]*size/1000 + 0.1, pts[0][1]*size/1000);
    for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0]*size/1000, pts[i][1]*size/1000);
    ctx.stroke();
    if (done) done.add(k);
  });
}
const DRAW_PENS = [{n:'검정',c:'#21242B'},{n:'빨강',c:'#D63A2F'},{n:'파랑',c:'#2F6FD6'}];

// ── 폭탄 해체
const WIRE_COLORS = ['빨강','파랑','노랑','흰색','검정'];
const WIRE_HEX = {'빨강':'#EF5A5A','파랑':'#3E8EF0','노랑':'#F2C744','흰색':'#F5F2EA','검정':'#15161A'};
const BTN_COLORS = ['빨강','파랑','노랑','흰색'];
const BTN_LABELS = ['중단','누르기','폭발','대기'];
const KEY_COLS = [
  ['★','◇','Ω','▲','ψ','●','¶'],
  ['◆','★','¶','∞','□','Ω','ж'],
  ['△','ψ','■','ж','◇','∞','λ'],
  ['●','λ','☆','§','▲','■','※']
];
const WIRE_RULES = ['빨간 선이 하나도 없으면 → 두 번째 선','마지막 선이 흰색이면 → 마지막 선','파란 선이 두 개 이상이면 → 마지막 파란 선','노란 선이 딱 하나면 → 첫 번째 선','그 밖에는 → 세 번째 선'];
const BUTTON_RULES = ['글자가 「폭발」이면 → 꾹 누르기','빨간 버튼에 글자가 「중단」이면 → 짧게 한 번','일련번호 마지막 숫자가 짝수면 → 꾹 누르기','노란 버튼이면 → 짧게 한 번','그 밖에는 → 꾹 누르기'];
function solveWires(w){
  const n = w.length, cnt = c => w.filter(x => x===c).length;
  if (!cnt('빨강')) return 1;
  if (w[n-1] === '흰색') return n-1;
  if (cnt('파랑') >= 2) return w.lastIndexOf('파랑');
  if (cnt('노랑') === 1) return 0;
  return 2;
}
function solveButton(btn, serial){
  const last = Number(String(serial).slice(-1));
  if (btn.label === '폭발') return 'hold';
  if (btn.color === '빨강' && btn.label === '중단') return 'tap';
  if (last % 2 === 0) return 'hold';
  if (btn.color === '노랑') return 'tap';
  return 'hold';

function teamCenterAvg(people, teams, n){

function enneaBalance(people, teams, n, rnd){

    let improved = false;
    const pairs = [];
    for (let i=0;i<ids.length;i++) for (let j=i+1;j<ids.length;j++) if (teams[ids[i]] !== teams[ids[j]]) pairs.push([ids[i], ids[j], rnd()]);

    for (const [a,b] of pairs){
      if (teams[a] === teams[b]) continue;
      const ta = teams[a], tb = teams[b];
      teams[a] = tb; teams[b] = ta;
      const sp = enneaSpread(people, teams, n), ok = sp.every((x,c) => x <= base[c]);

// 모으기(3팀): 행동파=1팀, 공감파=2팀, 전략파=3팀. 넘치면 다른 중심 점수가 가장 가까운 사람을 옮김
function enneaGroup(people, rnd){
  rnd = rnd || Math.random;
  const N = people.length, base = Math.floor(N / 3), extra = N % 3;
  const natural = [0,1,2].map(c => people.filter(p => p.type && p.center === c).length);
  const order = [0,1,2].sort((a,b) => natural[b] - natural[a]);
  const cap = [base, base, base]; order.slice(0, extra).forEach(c => cap[c]++);
  const team = {}, scouted = {};
  people.forEach(p => { if (p.type) team[p.pid] = p.center; });
  const count = c => Object.values(team).filter(x => x === c).length;
  people.filter(p => !p.type).map(p => ({p, k: rnd()})).sort((a,b) => a.k - b.k).forEach(({p}) => {
    const under = [0,1,2].filter(c => count(c) < cap[c]);
    team[p.pid] = under.length ? under[0] : [0,1,2].sort((a,b) => count(a) - count(b))[0];
  });
  for (let guard = 0; guard < 100; guard++){
    const over = [0,1,2].filter(c => count(c) > cap[c]), under = [0,1,2].filter(c => count(c) < cap[c]);
    if (!over.length || !under.length) break;
    let best = null;
    people.forEach(p => {
      if (!over.includes(team[p.pid])) return;
      under.forEach(u => {

}

  if (g === 'lobby') return 'lobby|' + JSON.stringify([players, cfg, scores]);
  if (ph === 'setup') return 'setup|' + g + '|' + myTeam() + '|' + JSON.stringify(cfg);
  if (ph === 'result') return 'result|' + r + '|' + JSON.stringify([ST.result, cfg]) + (g === 'ennea' ? JSON.stringify(players) : '');
  if (g === 'tug') return ['tug', r, ST.a, ST.b, myTeam(), JSON.stringify(cfg.teamNames||{})].join('|');
  if (g === 'nunchi') return ['nunchi', r, inAlive()].join('|');
  if (g === 'mugung') return ['mugung', r, inAlive(), L.out, L.fin].join('|');
  if (g === 'ennea') return ['ennea', r, enDone(), L.en ? L.en.review : 0].join('|');
  if (g === 'piano') return ['piano', r, myTeam(), pianoMine()].join('|');
  if (g === 'draw') return ['draw', r, myTeam(), JSON.stringify(cfg.teamNames||{})].join('|');
  if (g === 'bomb') return ['bomb', r, myTeam(), bombRole(), teamMembers(players, myTeam()).join(',')].join('|');
  if (g === 't10') return ['t10', r, inAlive()].join('|');
  if (g === 'minor') return ['minor', r, inAlive(), (ST.q||{}).n, !!(ST.q||{}).closed].join('|');
  if (g === 'chicken') return ['chicken', r, inAlive()].join('|');
  return 'lobby';
}

function buildScreen(){
  document.body.className = '';
  if (screenKey === 'loading') return '<div class="grow"><div class="muted">연결 중…</div></div>';
  if (screenKey === 'join') return joinView();
  const g = ST.game || 'lobby';
  if (g === 'lobby') return lobbyView();
  if (ST.phase === 'setup') return introView();
  if (ST.phase === 'result') return resultView();
  if (g === 'tug') return tugView();
  if (g === 'nunchi') return nunchiView();
  if (g === 'mugung') return mugungView();
  if (g === 'ennea') return enneaView();
  if (g === 'piano') return pianoView();
  if (g === 'draw') return drawView();
  if (g === 'bomb') return bombView();
  if (g === 't10') return t10View();
  if (g === 'minor') return minorView();
  if (g === 'chicken') return chickenView();
  return lobbyView();
}

function bindScreen(){
  const jb = $('joinBtn');
  if (jb){
    jb.onclick = join;

  const mb = $('mBtn');

async function join(){
  const v = ($('nameIn').value || '').trim();
  const msg = $('joinMsg'), b = $('joinBtn');
  if (v.length < 2 || v.length > 10){ msg.textContent = '이름을 2~10자로 넣어 주세요'; return; }
  b.disabled = true; b.textContent = '입장 중…';
  try{
    const cur = (await get(R('players'))).val() || {};
    if (Object.values(cur).some(p => p && p.name === v)){
      msg.textContent = '같은 이름이 이미 있어요. 뒤에 지부나 이니셜을 붙여 주세요 (예: ' + v + 'B)';
      b.disabled = false; b.textContent = '입장하기'; return;
    }
    const pid = 'p' + Math.random().toString(36).slice(2, 10);

    PID = pid; localStorage.setItem('ws26_pid', pid);
    render();
  }catch(e){
    msg.textContent = '연결이 안 돼요. 와이파이를 확인하고 다시 눌러 주세요';

  }
}

function tugView(){

      <div class="muted center">이번 경기는 ${esc(teamName(cfg,a))} vs ${esc(teamName(cfg,b))}<br>목청껏 응원하세요!</div></div>`;

function onTugTap(e){
  e.preventDefault();
  const t = now();
  if (!isLive() || t < ST.startAt || t > ST.endAt || !tugPlaying()) return;
  L.taps++; L.dirty = true;
  tickTug();
}
function tickTug(){
  const t = now();
  const timer = $('tugTimer'); if (!timer) return;
  if (t < ST.startAt) timer.textContent = TUG_SECONDS;
  else if (t <= ST.endAt) timer.textContent = Math.max(0, Math.ceil((ST.endAt - t)/1000));
  else timer.textContent = '끝!';
  const taps = Object.assign({}, play);
  if (tugPlaying()) taps[PID] = Math.max(Number(taps[PID])||0, L.taps);
  const s = tugStats(players, taps, ST.a, ST.b);
  $('tugFill').style.width = (s.share * 100).toFixed(1) + '%';
  $('tugA').textContent = '평균 ' + s[ST.a].avg.toFixed(1) + '회';
  $('tugB').textContent = '평균 ' + s[ST.b].avg.toFixed(1) + '회';
  const mine = $('tugMine');
  if (mine) mine.textContent = t > ST.endAt ? '결과 집계 중… 나 ' + L.taps + '회' : '나 ' + L.taps + '회 · 팀 평균으로 비교해요';
  const btn = $('tapBtn');
  if (btn) btn.disabled = t > ST.endAt;
}

function onNunchiPress(e){

function tickNunchi(){
  const nx = $('nNext'); if (!nx) return;

  const html = j.rows.map(r => {

  }).join('');
  const lastHtml = j.last.length ? `<div class="row"><span class="num" style="color:var(--accent)">꼴</span><span class="strike" style="flex:1;font-weight:700">${j.last.map(p=>esc(playerName(players,p))).join(' · ')}</span><span class="badge">끝까지 못 누름</span></div>` : '';
  $('nList').innerHTML = (html + lastHtml) || '<div class="muted center" style="padding:10px 0">누가 먼저 1을 부를까요?</div>';
  let mine = '';

  if (sr) mine = sr.kind === 'safe' ? sr.num + '번 성공! 살았어요' : '동시에 눌러서 탈락…';

  $('nMine').textContent = mine;

}

  if (L.fin) return `<div class="grow" style="flex:0;padding:24px 0"><div style="font-size:64px;font-weight:900;line-height:1">골인!</div>
    <div id="mRank" style="font-size:26px;font-weight:900"></div></div><div class="card" id="mBoard"></div>`;
  return `<div><div class="gl"><span>내 위치</span><span id="mPct">0 / ${ST.goal}</span></div><div class="bar"><div id="mFill" style="width:0%"></div></div></div>
    <div class="grow">
      <div id="mSign" style="font-size:42px;font-weight:900;text-align:center;line-height:1.2"></div>
      <button class="tap" id="mBtn">연타!</button>
    </div>
    <div class="muted center" id="mInfo"></div>`;
}
function onMugungTap(e){
  e.preventDefault();
  if (!isLive() || now() < ST.startAt || L.out || L.fin || !inAlive()) return;
  if (ST.light === 'green'){
    L.p++;
    if (L.p >= ST.goal){
      L.fin = true; L.dirty = false;
      update(R('play/mugung/' + ST.round + '/' + PID), {p: L.p, fin: serverTimestamp()});
      render(); return;
    }
    L.dirty = true;
  } else if (performance.now() - L.redSeenAt > MUGUNG_GRACE){
    L.out = true; L.dirty = false;
    update(R('play/mugung/' + ST.round + '/' + PID), {p: L.p, out: true});
    try { navigator.vibrate && navigator.vibrate([80,60,80]); } catch(e){}
    render(); return;
  }
  tickMugung();
}
function tickMugung(){
  const started = isLive() && now() >= (ST.startAt||0);
  document.body.className = started && !L.out && !L.fin && inAlive() ? (ST.light === 'red' ? 'red' : 'green') : '';
  const goal = ST.goal || 50;
  const rows = rankMugung(ST.alive||[], play, goal);
  const fin = $('mFill');
  if (fin){
    fin.style.width = Math.min(100, L.p / goal * 100).toFixed(1) + '%';
    $('mPct').textContent = L.p + ' / ' + goal;
    const red = ST.light === 'red';
    $('mSign').innerHTML = !started ? '준비' : (red ? '멈춰!' : '무궁화 꽃이<br>피었습니다');
    $('mBtn').textContent = red ? '누르면 탈락' : '연타!';
    $('mInfo').textContent = '생존 ' + rows.filter(r=>!r.out).length + '명 · 골인 ' + rows.filter(r=>r.fin!=null).length + '명';
  }
  const rk = $('mRank');
  if (rk){ const mine = rows.find(r => r.pid === PID); rk.textContent = mine && mine.rank ? mine.rank + '등' : ''; }
  const bd = $('mBoard');
  if (bd){
    bd.innerHTML = '<div class="sec-t">현재 순위</div>' + rows.map(r => `<div class="row">
      <span class="num">${r.rank || '-'}</span><span style="flex:1;font-weight:700" class="${r.out?'strike':''}">${esc(playerName(players, r.pid))}${r.pid===PID?' (나)':''}</span>
      <span class="muted">${r.out ? '탈락' : (r.fin!=null ? '골인' : r.p + '/' + goal)}</span></div>`).join('');
  }
}


// ── 에니어그램 팀 짜기
function enInit(){ if (!L.en) L.en = {order: seededShuffle(ENNEA_ITEMS, PID + (ST.round||'')), idx: 0, ans: {}, review: 0}; }
function enFirstOpen(){ const i = L.en.order.findIndex(it => !L.en.ans[it.id]); return i < 0 ? L.en.order.length : i; }
function enDone(){ if (!L.en) return false; return ENNEA_ITEMS.every(it => L.en.ans[it.id]) && !L.en.review; }
function enneaCard(type, scores, showBars){
  if (!type) return `<div class="card center"><div style="font-size:20px;font-weight:900">유형 없음</div><div class="muted">테스트를 다 못 해서 남는 자리에 들어갔어요</div></div>`;
  const c = ENNEA_CENTER[type], T = ENNEA_TYPES[type];
  let bars = '';
  if (showBars && scores){
    const top = [1,2,3,4,5,6,7,8,9].sort((a,b) => scores[b] - scores[a]).slice(0, 3);

// ── 릴레이 캐치마인드
const D = {cur:null, flushed:0, pen:DRAW_PENS[0].c, drawn:new Set(), size:0, ctx:null, round:''};
function drawRole(){ const t = myTeam(); if (!t) return 'none'; return t === ST.team ? 'drawer' : 'guesser'; }
function drawEnd(){ return ST.startAt + asList(ST.order).length * (Number(ST.secs)||4) * 1000; }
function drawView(){

  const pens = role === 'drawer' ? `<div style="display:flex;gap:8px;align-items:center" id="dPens">${DRAW_PENS.map(p => `<button class="pen" data-pen="${p.c}" aria-label="${p.n} 펜" style="background:${p.c}"></button>`).join('')}<span class="muted" style="margin-left:auto" id="dMyTurn"></span></div>` : '';
  const guess = role === 'guesser' ? `<div style="display:flex;gap:8px"><input class="field" id="gIn" maxlength="20" placeholder="정답 입력" autocomplete="off" style="padding:12px"><button class="btn" id="gBtn" style="width:90px">제출</button></div>` :

    <canvas id="dCv" class="cv"></canvas>${pens}${guess}<div class="card" id="dFeed" style="min-height:50px"></div><div class="muted center" id="dOrder"></div>`;
}
function setupCanvas(){
  const cv = $('dCv'); if (!cv) return;
  const w = Math.min(cv.parentElement.clientWidth, 440);
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = w + 'px'; cv.style.height = w + 'px';
  cv.width = Math.round(w * dpr); cv.height = Math.round(w * dpr);
  D.ctx = cv.getContext('2d'); D.size = cv.width; D.drawn = new Set();
  D.ctx.fillStyle = '#F5F2EA'; D.ctx.fillRect(0, 0, D.size, D.size);
  if (drawRole() === 'drawer'){
    cv.addEventListener('pointerdown', drawDown, {passive:false});
    cv.addEventListener('pointermove', drawMove, {passive:false});
    cv.addEventListener('pointerup', drawUp); cv.addEventListener('pointercancel', drawUp); cv.addEventListener('pointerleave', drawUp);
    document.querySelectorAll('[data-pen]').forEach(b => b.onclick = () => { D.pen = b.dataset.pen; markPen(); });
    markPen();
  }
  const gb = $('gBtn');
  if (gb){ gb.onclick = sendGuess; $('gIn').onkeydown = e => { if (e.key === 'Enter') sendGuess(); }; }
}
function markPen(){ document.querySelectorAll('[data-pen]').forEach(b => b.style.outline = b.dataset.pen === D.pen ? '3px solid var(--ivory)' : 'none'); }
function canDraw(){ const t = now(); return isLive() && drawRole() === 'drawer' && drawTurn(ST, t).pid === PID; }
function cvPoint(e){ const r = $('dCv').getBoundingClientRect(); return [Math.round(Math.max(0, Math.min(1000, (e.clientX - r.left) / r.width * 1000))), Math.round(Math.max(0, Math.min(1000, (e.clientY - r.top) / r.height * 1000)))]; }
function drawDown(e){ e.preventDefault(); if (!canDraw()) return; D.cur = [cvPoint(e)]; D.flushed = 0; drawLocal(D.cur[0], D.cur[0]); }
function drawMove(e){
  e.preventDefault();
  if (!D.cur) return;
  if (!canDraw()){ drawUp(); return; }
  const p = cvPoint(e), q = D.cur[D.cur.length-1];
  if (Math.abs(p[0]-q[0]) + Math.abs(p[1]-q[1]) < 6) return;
  D.cur.push(p); drawLocal(q, p);
}
function drawUp(){ if (!D.cur) return; flushStroke(); D.cur = null; }
function drawLocal(a, b){

  c.strokeStyle = D.pen; c.lineWidth = 7 * k; c.lineCap = 'round'; c.lineJoin = 'round';
  c.beginPath(); c.moveTo(a[0]*k, a[1]*k); c.lineTo(b[0]*k + (a===b?0.1:0), b[1]*k); c.stroke();
}
function flushStroke(){

  const seg = D.cur.slice(Math.max(0, D.flushed - 1));
  D.flushed = D.cur.length;
  push(R('play/draw/' + ST.round + '/strokes'), {c: D.pen, w: 7, p: seg.map(q => q.join(',')).join(';')});
}
setInterval(() => { if (D.cur) flushStroke(); }, 120);
function sendGuess(){

  push(R('play/draw/' + ST.round + '/guesses'), {pid: PID, team: myTeam(), text: v.slice(0, 20), at: serverTimestamp()});

}

    <div class="card" style="display:flex;align-items:center;gap:14px"><div style="flex:1"><div class="sec-t">2단계 · 버튼</div><div class="muted" id="bBtnInfo">짧게 한 번 또는 꾹(2초) — 매뉴얼에 물어봐</div></div>
      <button class="bigbtn" id="bBtn" style="background:${WIRE_HEX[b.button.color]||'#ccc'}">${esc(b.button.label)}</button></div>
    <div class="card"><div class="gl"><span class="gold">3단계 · 기호</span><span class="muted" id="bKeyProg"></span></div><div class="keygrid" id="bKeys">${b.keys.map(k => `<button class="keyb" data-key="${k}">${k}</button>`).join('')}</div></div>
    ${holders ? '' : manualHTML([0,1,2])}`;
}
function bombData(){ return (play||{})[myTeam()] || {}; }
function bombOver(d){ return !!d.x || typeof d.at === 'number' || now() > ST.endAt; }
function bombWrite(patch, wrong){
  const d = bombData(), s = (Number(d.s)||0) + (wrong ? 1 : 0);
  const u = Object.assign({}, patch, {s});
  if (s >= BOMB_MAX_STRIKES) u.x = 1;
  const next = Object.assign({}, d, u);
  if (!u.x && next.w && next.b && next.ks) u.at = Math.max(1, now() - ST.startAt);
  update(R('play/bomb/' + ST.round + '/' + myTeam()), u);
  if (wrong){ document.body.classList.add('flash'); setTimeout(() => document.body.classList.remove('flash'), 350); try { navigator.vibrate && navigator.vibrate(200); } catch(e){} }
}
function bindBomb(){
  const bw = $('bWires');
  if (bw) bw.onclick = e => {
    const btn = e.target.closest('[data-wire]'); if (!btn) return;
    const d = bombData(), i = Number(btn.dataset.wire);
    if (!isLive() || now() < ST.startAt || bombOver(d) || d.w || (d.wc && d.wc[i])) return;
    const ok = solveWires(myBomb().wires) === i;
    bombWrite({['wc/' + i]: 1, w: ok ? 1 : 0}, !ok);
  };
  const bb = $('bBtn');
  if (bb){
    let t0 = 0;
    bb.addEventListener('pointerdown', e => { e.preventDefault(); if (!isLive() || now() < ST.startAt || bombOver(bombData()) || bombData().b) return; t0 = performance.now(); L.holdStart = t0; }, {passive:false});
    const up = () => {
      if (!t0) return;
      const dur = performance.now() - t0; t0 = 0; L.holdStart = 0;
      const info = $('bBtnInfo');
      let kind = dur < 800 ? 'tap' : (dur >= 1800 ? 'hold' : '');
      if (!kind){ if (info) info.textContent = '애매해요! 탁 짧게 또는 2초 넘게 꾹'; return; }
      const b = myBomb(), ok = solveButton(b.button, b.serial) === kind;
      bombWrite({b: ok ? 1 : 0}, !ok);
    };
    bb.addEventListener('pointerup', up); bb.addEventListener('pointercancel', up); bb.addEventListener('pointerleave', up);
  }
  const bk = $('bKeys');
  if (bk) bk.onclick = e => {
    const btn = e.target.closest('[data-key]'); if (!btn) return;
    const d = bombData();
    if (!isLive() || now() < ST.startAt || bombOver(d) || d.ks) return;
    const order = keypadOrder(myBomb().keys), k = Number(d.k)||0;
    if (btn.dataset.key === order[k]) bombWrite(k + 1 >= 4 ? {k: 4, ks: 1} : {k: k + 1}, false);
    else bombWrite({k: 0}, true);
  };
}
function tickBomb(){
  const tm = $('bTimer');
  const box = $('bTeams');
  if (box){
    const teams = Object.keys(ST.bombs||{}).map(Number);
    box.innerHTML = '<div class="sec-t">팀별 상황</div>' + rankBomb(teams, play).map(r => `<div class="row"><span class="dot" style="background:${teamColor(r.team)}"></span><span style="flex:1;font-weight:700">${esc(teamName(cfg,r.team))}</span><span class="muted">${r.at!=null ? '해체 ' + fmtSec2(r.at) + '초' : (r.exploded ? '펑!' : r.mods + '/3 단계')}</span></div>`).join('');
  }
  if (!tm) return;
  const d = bombData(), t = now();
  const left = Math.max(0, (t < ST.startAt ? ST.endAt - ST.startAt : ST.endAt - t));
  tm.textContent = d.at != null && typeof d.at === 'number' ? '해체!' : (d.x || (t > ST.endAt) ? '펑!' : Math.floor(left/60000) + ':' + String(Math.floor(left/1000) % 60).padStart(2,'0'));
  tm.style.color = typeof d.at === 'number' ? 'var(--gold)' : '#EF5A5A';
  $('bStrikes').textContent = Math.min(Number(d.s)||0, BOMB_MAX_STRIKES) + ' / ' + BOMB_MAX_STRIKES;
  const over = bombOver(d);
  const mods = $('bMods');
  if (mods) mods.innerHTML = '<div class="sec-t">진행</div>' + [['전선', d.w], ['버튼', d.b], ['기호', d.ks]].map(([n,ok]) => `<div class="row"><span style="flex:1;font-weight:700">${n}</span><span class="${ok?'gold':'muted'}">${ok ? '해체 완료' : '남음'}</span></div>`).join('');
  const bw = $('bWires');
  if (bw){
    const b = myBomb(), wc = d.wc || {};
    bw.innerHTML = b.wires.map((c,i) => `<div style="display:flex;align-items:center;gap:10px;margin:6px 0"><span class="muted" style="width:14px">${i+1}</span>
      <div style="flex:1;height:14px;border-radius:99px;background:${WIRE_HEX[c]};${wc[i]?'opacity:.25;':''}${c==='검정'?'border:1px solid #5A6B95;':''}"></div>
      <span class="muted" style="width:30px">${c}</span><button class="sm" data-wire="${i}" ${wc[i]||d.w||over?'disabled':''}>${wc[i]?'잘림':'자르기'}</button></div>`).join('') + (d.w ? '<div class="gold" style="font-weight:700">전선 해체 완료</div>' : '');
    const ki = $('bKeyProg'); if (ki) ki.textContent = d.ks ? '해체 완료' : (Number(d.k)||0) + ' / 4';
    const order = keypadOrder(b.keys), k = Number(d.k)||0;
    document.querySelectorAll('[data-key]').forEach(el => { const done = d.ks || order.indexOf(el.dataset.key) < k; el.style.background = done ? 'var(--gold)' : ''; el.style.color = done ? 'var(--ink)' : ''; el.disabled = over && !done; el.style.opacity = over && !done ? .4 : 1; });
    const bi = $('bBtnInfo');
    if (bi){ if (d.b) bi.textContent = '버튼 해체 완료'; else if (L.holdStart) bi.textContent = '누르는 중… ' + ((performance.now() - L.holdStart)/1000).toFixed(1) + '초'; }
    $('bBtn').style.opacity = d.b || over ? .35 : 1;
  }
}

// ── 10초 맞히기
function t10View(){
  if (!inAlive()) return `<div class="grow"><div style="font-size:24px;font-weight:900">관전 중</div><div class="muted center">시작 뒤에 들어와서 이번 판은 구경해요</div></div>`;
  return `<div class="grow"><div class="muted" id="tHint">숫자는 3초 뒤에 사라져요</div><div class="big" id="tNum" style="font-size:88px">0.00</div>
    <div id="tMine" style="font-size:20px;font-weight:900;min-height:28px"></div></div>
    <button class="btn huge" id="tBtn">멈춰!</button><div class="muted center">감으로 딱 10.00초에 누르세요 · 가장 가까운 사람이 1등</div>`;
}
function onT10Press(e){
  e.preventDefault();
  if (!isLive() || now() < ST.startAt || L.pressed || !inAlive()) return;
  L.pressed = true; L.t10 = now() - ST.startAt;
  set(R('play/t10/' + ST.round + '/' + PID), Math.round(L.t10));
  tickT10();
}
function tickT10(){
  const n = $('tNum'); if (!n) return;
  const t = now(), el = t - ST.startAt;
  const mine = typeof play[PID] === 'number' ? play[PID] : (L.pressed ? L.t10 : null);
  if (mine != null){ n.textContent = fmtSec2(mine); $('tMine').textContent = '오차 ' + fmtSec2(Math.abs(mine - 10000)) + '초'; $('tHint').textContent = '내 기록'; }
  else if (t < ST.startAt) n.textContent = '0.00';
  else n.textContent = el < 3000 ? fmtSec2(el) : '?.??';
  const b = $('tBtn'); if (b) b.disabled = mine != null || t < ST.startAt;
}

// ── 소수파 생존
function minorView(){
  const q = ST.q;
  const header = `<div class="center"><div class="muted">${q ? q.n + '번째 질문 · ' : ''}생존 ${asList(ST.alive).length}명</div></div>`;
  if (!q) return header + `<div class="grow"><div style="font-size:22px;font-weight:900">곧 첫 질문</div><div class="muted center">둘 중 하나! 적게 고른 쪽만 살아남아요</div></div>`;
  if (q.closed){
    const r = q.res || {}, surv = asList(r.survivors).includes(PID);
    const was = asList(r.voters).includes(PID);
    return header + `<div class="grow"><div style="font-size:20px;font-weight:700">${esc(q.a)} ${Number(r.aN)||0}명 vs ${esc(q.b)} ${Number(r.bN)||0}명</div>
      <div style="font-size:30px;font-weight:900">${r.tie ? '동점! 모두 생존' : (esc(r.winLabel||'') + ' 생존')}</div>
      <div class="banner" style="background:${surv?'var(--gold)':'var(--ivory)'};font-size:26px">${!was ? '이번 질문은 구경' : (surv ? '살았다!' : '탈락…')}</div></div>
      <div class="muted center">사회자가 다음 질문을 열면 바뀌어요</div>`;
  }
  if (!inAlive()) return header + `<div class="grow"><div style="font-size:26px;font-weight:900">${esc(q.a)} vs ${esc(q.b)}</div><div class="muted center">탈락해서 구경 중이에요</div><div class="big" id="mnTime" style="font-size:56px"></div></div>`;
  return header + `<div class="center" style="font-size:15px;font-weight:700">적게 고른 쪽이 살아남아요</div><div class="big gold" id="mnTime" style="font-size:56px"></div>
    <div style="display:flex;flex-direction:column;gap:12px;flex:1;justify-content:center">
      <button class="choice" data-pick="a" id="mnA">${esc(q.a)}</button><button class="choice" data-pick="b" id="mnB">${esc(q.b)}</button></div>
    <div class="muted center">마감 전까지는 바꿀 수 있어요 · 안 고르면 탈락</div>`;
}
function bindMinor(){
  document.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
    const q = ST.q; if (!q || q.closed || !inAlive() || now() > q.closeAt) return;
    L.pick = b.dataset.pick; L.pickQ = q.n;
    set(R('play/minor/' + ST.round + '/q' + q.n + '/' + PID), b.dataset.pick);
    tickMinor();
  });
}
function tickMinor(){
  const q = ST.q; if (!q) return;
  const tm = $('mnTime'); if (tm) tm.textContent = q.closed ? '' : Math.max(0, Math.ceil((q.closeAt - now())/1000));
  const mine = ((play||{})['q' + q.n] || {})[PID] || (L.pickQ === q.n ? L.pick : null);
  ['a','b'].forEach(k => { const b = $(k === 'a' ? 'mnA' : 'mnB'); if (b){ b.classList.toggle('on', mine === k); b.disabled = now() > q.closeAt; } });
}

// ── 치킨 버튼
function chickenView(){
  if (!inAlive()) return `<div class="grow"><div style="font-size:24px;font-weight:900">관전 중</div></div><div class="big gold" id="cPot">0</div><div class="card" id="cList"></div>`;
  return `<div class="center muted">점수가 계속 올라가요. 언제 터질지는 아무도 몰라요</div>
    <div class="grow"><div class="big gold" id="cPot" style="font-size:110px">0</div><div id="cMine" style="font-size:20px;font-weight:900;min-height:28px"></div></div>
    <button class="btn huge" id="cBtn">지금 챙기기!</button><div class="card" id="cList"></div>`;
}
function onChickenPress(e){
  e.preventDefault();
  if (!isLive() || now() < ST.startAt || L.pressed || !inAlive() || now() >= ST.explodeAt) return;
  L.pressed = true; L.chick = chickenValue(ST.startAt, now());
  set(R('play/chicken/' + ST.round + '/' + PID), serverTimestamp());
  tickChicken();
}
function tickChicken(){
  const pot = $('cPot'); if (!pot) return;
  const t = now(), boom = t >= ST.explodeAt;
  pot.textContent = t < ST.startAt ? '0' : (boom ? '펑!' : chickenValue(ST.startAt, t));
  pot.style.color = boom ? '#EF5A5A' : 'var(--gold)';
  const ts = (play||{})[PID];
  const mine = $('cMine');
  if (mine) mine.textContent = typeof ts === 'number' ? (ts < ST.explodeAt ? chickenValue(ST.startAt, ts) + '점 챙겼어요!' : '펑… 0점') : (L.pressed ? L.chick + '점 챙기는 중…' : (boom ? '펑… 못 챙겼어요 0점' : ''));
  const b = $('cBtn'); if (b) b.disabled = L.pressed || typeof ts === 'number' || boom || t < ST.startAt;
  const list = Object.keys(play||{}).filter(p => typeof play[p] === 'number' && play[p] < ST.explodeAt).sort((x,y) => play[y] - play[x]);
  $('cList').innerHTML = '<div class="sec-t">챙긴 사람</div>' + (list.map(p => `<div class="row"><span style="flex:1;font-weight:700">${esc(playerName(players,p))}${p===PID?' (나)':''}</span><b>${chickenValue(ST.startAt, play[p])}점</b></div>`).join('') || '<div class="muted">아직 아무도 안 챙겼어요</div>');
}

// ── 결과
function resultView(){
  const res = ST.result || {};
  let body = '';
  if (res.kind === 'tug'){
    const w = res.winner;
    body = (w ? `<div class="banner" style="background:${teamColor(w)}">${esc(teamName(cfg, w))} 승리!</div>`
             : `<div class="banner" style="background:var(--ivory)">무승부!</div>`) +
      `<div class="card"><div class="row"><span class="dot" style="background:${teamColor(res.a)}"></span><span style="flex:1;font-weight:700">${esc(teamName(cfg,res.a))}</span><span class="muted">평균 ${Number(res.avgA).toFixed(1)}회 · 합계 ${res.sumA}</span></div>
      <div class="row"><span class="dot" style="background:${teamColor(res.b)}"></span><span style="flex:1;font-weight:700">${esc(teamName(cfg,res.b))}</span><span class="muted">평균 ${Number(res.avgB).toFixed(1)}회 · 합계 ${res.sumB}</span></div></div>`;
  } else if (res.kind === 'nunchi'){
    const surv = (res.survivors||[]).includes(PID), lost = (res.losers||[]).includes(PID);
    body = `<div class="banner" style="background:${surv ? 'var(--gold)' : 'var(--ivory)'}">${surv ? '살아남았어요!' : (lost ? '아쉽게 탈락' : '눈치게임 끝')}</div>
      <div class="card"><div class="sec-t">생존 ${(res.survivors||[]).length}명</div><div class="muted" style="color:var(--ivory)">${(res.survivorNames||[]).map(esc).join(' · ') || '없음'}</div></div>
      <div class="card"><div class="sec-t">탈락</div><div class="muted">${(res.loserNames||[]).map(esc).join(' · ') || '없음'}</div></div>`;
  } else if (res.kind === 'mugung'){
    const rows = res.rows || [];
    body = `<div class="banner" style="background:var(--gold)">${rows[0] && rows[0].rank ? esc(rows[0].name) + ' 1등!' : '무궁화 끝'}</div>
      <div class="card">${rows.map(r => `<div class="row"><span class="num">${r.rank || '-'}</span>
      <span style="flex:1;font-weight:700" class="${r.out?'strike':''}">${esc(r.name)}${r.pid===PID?' (나)':''}</span>
      <span class="muted">${r.out ? '탈락' : (r.fin ? '골인' : r.p + '/' + res.goal)}</span></div>`).join('')}</div>`;
  }
  else if (res.kind === 'ennea'){ body = enneaResult(res); }
  else if (res.kind === 'piano' || res.kind === 'bomb'){
    const rows = asList(res.rows), w = rows[0];
    const ok = r => res.kind === 'piano' ? r.fin != null : r.at != null;
    body = `<div class="banner" style="background:${w && ok(w) ? teamColor(w.team) : 'var(--ivory)'}">${w && ok(w) ? esc(teamName(cfg, w.team)) + ' 1등!' : (res.kind === 'bomb' ? '아무도 해체 못 함' : '아무도 완주 못 함')}</div>
      <div class="card">${rows.map(r => `<div class="row"><span class="num">${r.rank}</span><span class="dot" style="background:${teamColor(r.team)}"></span><span style="flex:1;font-weight:700">${esc(teamName(cfg,r.team))}</span>
      <span class="muted">${res.kind === 'piano' ? (r.fin != null ? fmtSec2(r.fin) + '초' : r.pos + '칸') : (r.at != null ? fmtSec2(r.at) + '초' : (r.exploded ? '펑! ' : '') + r.mods + '/3')}</span></div>`).join('')}</div>`;
  } else if (res.kind === 'draw'){
    const c = res.correct;
    body = `<div class="card center"><div class="muted">정답</div><div style="font-size:34px;font-weight:900">${esc(res.word)}</div></div>
      ${c ? `<div class="banner" style="background:${teamColor(c.team)}">${esc(c.name)} 정답! (${esc(teamName(cfg,c.team))})</div>` : `<div class="banner" style="background:var(--ivory)">아무도 못 맞혔어요</div>`}
      <div class="muted center">그린 팀: ${esc(teamName(cfg,res.team))}</div>`;
  } else if (res.kind === 't10' || res.kind === 'chicken'){
    const rows = asList(res.rows);
    body = `<div class="banner" style="background:var(--gold)">${rows[0] && rows[0].rank ? esc(rows[0].name) + ' 1등!' : '1등 없음'}</div>
      <div class="card">${rows.map(r => `<div class="row"><span class="num">${r.rank || '-'}</span><span style="flex:1;font-weight:700">${esc(r.name)}${r.pid===PID?' (나)':''}</span>
      <span class="muted">${res.kind === 't10' ? (r.ms != null ? fmtSec2(r.ms) + '초' : '안 누름') : (r.v ? r.v + '점' : '펑 0점')}</span></div>`).join('')}</div>`;
  } else if (res.kind === 'minor'){
    const surv = asList(res.survivors).includes(PID);
    body = `<div class="banner" style="background:${surv ? 'var(--gold)' : 'var(--ivory)'}">${surv ? '최후의 생존자!' : '소수파 생존 끝'}</div>
      <div class="card"><div class="sec-t">생존 ${asList(res.survivors).length}명</div><div style="font-weight:700">${asList(res.survivorNames).map(esc).join(' · ') || '없음'}</div></div>`;
  }
  return `<div class="center muted">${esc(GAME_TITLES[ST.game] || '')} 결과</div>${body}
    <div class="muted center" style="margin-top:auto">다음 게임을 기다려요</div>`;
}

// ── 시계 (카운트다운·타이머)
function tick(){
  const cd = $('cd');
  const showCd = isLive() && ST.startAt && now() < ST.startAt && screenKey !== 'join' && !screenKey.startsWith('result');
  if (showCd){
    cd.classList.add('show');
    $('cdNum').textContent = Math.max(1, Math.ceil((ST.startAt - now())/1000));
    $('cdLabel').textContent = GAME_TITLES[ST.game] || '곧 시작';
  } else cd.classList.remove('show');
  if (!isLive()) { if (ST.game !== 'mugung') document.body.className = ''; return; }
  if (ST.game === 'tug') tickTug();
  else if (ST.game === 'nunchi') tickNunchi();
  else if (ST.game === 'mugung') tickMugung();
  else if (ST.game === 'piano') tickPiano();
  else if (ST.game === 'draw') tickDraw();
  else if (ST.game === 'bomb') tickBomb();
  else if (ST.game === 't10') tickT10();
  else if (ST.game === 'minor') tickMinor();
  else if (ST.game === 'chicken') tickChicken();
}
setInterval(tick, 100);
</script>
</body>
</html>
