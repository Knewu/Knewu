<!DOCTYPE html>

    <meta name="theme-color" content="#1f2d4d">

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <style>
        :root {
            --accent: #1a73e8; --accent-dk: #1557b0; --accent-tint: #eef4ff;
            --ink: #1f2329; --ink-soft: #646b76; --ink-faint: #9aa3ad;
            --line: #e7e9ed; --line-soft: #eef0f3;
            --page: #f4f6f8; --paper: #ffffff;
            --radius: 14px;
            --shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.04);
            --warn-ink: #8a5a00; --warn-bg: #fff4dd; --warn-bd: #f3dca0;
            --gold: #b8860b; --gold-bg: #fff8e1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard','Malgun Gothic',-apple-system,sans-serif; background: var(--page); color: var(--ink); padding-bottom: 60px; -webkit-font-smoothing: antialiased; letter-spacing: -.01em; }
        button, select, input, textarea { font-family: inherit; }

        /* ── 상단바 / 탭 ── */
        .topbar { background: var(--paper); border-bottom: 1px solid var(--line); padding: 0 12px; height: 56px; display: flex; align-items: center; gap: 8px; position: sticky; top: 0; z-index: 100; }
        .back-btn { display:inline-flex; align-items:center; gap:4px; text-decoration:none; color: var(--ink-soft); font-size:15px; font-weight:600; padding:7px 6px; border-radius:8px; }
        .back-btn:hover { background: var(--line-soft); color: var(--accent); }
        .crumb { font-size:15px; font-weight:800; }
        .st-chip { margin-left:auto; font-size:12.5px; font-weight:800; padding:6px 11px; border-radius:999px; white-space:nowrap; background: var(--line-soft); color: var(--ink-soft); }
        .st-chip.open { background: var(--accent-tint); color: var(--accent-dk); }
        .st-chip.voting { background: #fce8e6; color: #c5221f; }
        .st-chip.closed { background: #e6f4ea; color: #137333; }
        .st-chip.canceled { background: #eceef1; color: #5f6672; }
        .tabbar { position:sticky; top:56px; z-index:99; background:var(--paper); border-bottom:1px solid var(--line); padding:8px 12px; }
        .tabs { max-width:888px; margin:0 auto; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:4px; background:#eef0f3; border-radius:10px; padding:3px; }
        .tab-btn { height:44px; border:none; background:none; border-radius:8px; font-size:14px; font-weight:700; color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; }
        .tab-btn.active { background:#fff; color:var(--accent-dk); font-weight:800; box-shadow:0 1px 2px rgba(0,0,0,.1); }
        .tab-btn .cnt { font-size:11px; font-weight:800; background:#dfe6f0; color:#3d4a60; border-radius:999px; padding:1px 7px; }
        .tab-btn.active .cnt { background: var(--accent-tint); color: var(--accent-dk); }
        .tab-panel { display:none; } .tab-panel.active { display:block; }
        .wrap { max-width: 920px; margin: 0 auto; padding: 14px 12px 24px; }

        .card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
        .card + .card { margin-top: 12px; }
        .pad { padding: 16px; }

        /* ── 공모 안내 ── */
        .topic-h { font-size: 20px; font-weight: 800; letter-spacing: -.4px; line-height: 1.3; }
        .topic-meta { margin-top: 6px; font-size: 12.5px; color: var(--ink-soft); display:flex; gap:10px; flex-wrap:wrap; }
        .topic-desc { margin-top: 10px; font-size: 14px; line-height: 1.6; color: #33404f; white-space: pre-wrap; }
        .notice { display:flex; gap:8px; align-items:flex-start; background:var(--accent-tint); border-radius:9px; padding:10px 12px; font-size:13px; line-height:1.6; color:#1a4d8f; }
        .notice.warn { background: var(--warn-bg); color: var(--warn-ink); border:1px solid var(--warn-bd); }
        .notice b { font-weight:800; }
        .empty { color: var(--ink-faint); font-size: 14px; text-align:center; padding: 28px 10px; line-height:1.6; }

        /* ── 입력 ── */
        .fld { display:flex; flex-direction:column; gap:6px; }
        .fld + .fld { margin-top: 12px; }
        .fld-lbl { font-size:12px; font-weight:700; color:var(--ink-soft); }
        .fld-lbl .opt { font-weight:600; color:var(--ink-faint); margin-left:4px; }
        .fld-ex { font-size:12.5px; color:var(--ink-faint); line-height:1.5; white-space:pre-wrap; margin-top:-2px; }
        .nf-block { border:1px solid var(--line); border-radius:10px; padding:8px; }
        .nf-block + .nf-block { margin-top:6px; }
        .nf-block .nf-ex { margin-top:6px; }
        .nf-block .nf-ex input { font-size:13px; padding:9px 11px; }
        .inp, textarea.inp { width:100%; padding:11px 12px; font-size:15px; border:1px solid var(--line); border-radius:10px; background:#fcfdfe; color:var(--ink); line-height:1.5; }
        textarea.inp { min-height: 72px; resize: vertical; }
        .inp:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(26,115,232,.12); background:#fff; }
        .inp.main { font-size:17px; font-weight:700; }
        .btn { cursor:pointer; border-radius:10px; font-weight:800; border:none; }
        .btn-primary { width:100%; height:50px; background:var(--accent); color:#fff; font-size:15px; margin-top:14px; }
        .btn-primary:hover { background:var(--accent-dk); }
        .btn-primary:disabled { background:#b9c6da; cursor:default; }
        .btn-ghost { background:#fff; color:var(--ink-soft); border:1px solid var(--line); font-size:12.5px; font-weight:700; padding:0 12px; height:40px; border-radius:9px; }
        .btn-ghost:hover { border-color:var(--accent); color:var(--accent); }
        .btn-warn { background:#fff; color:var(--warn-ink); border:1.5px solid #e0902a; height:48px; font-size:14px; width:100%; }
        .btn-warn:hover { background:#fdf1dc; }
        .btn-danger { background:#fff; color:#c5221f; border:1.5px solid #e8a19c; height:48px; font-size:14px; width:100%; }
        .btn-danger:hover { background:#fdf0ef; }
        .seg { display:inline-flex; background:#eef0f3; border-radius:8px; padding:3px; }
        .seg button { height:38px; padding:0 16px; font-size:13px; font-weight:700; color:var(--ink-soft); background:none; border:none; border-radius:6px; cursor:pointer; }
        .seg button.on { background:#fff; color:var(--accent-dk); font-weight:800; box-shadow:0 1px 2px rgba(0,0,0,.1); }
        .row { display:flex; align-items:center; gap:8px; }
        .grow { flex:1; min-width:0; }
        .sec-h { font-size:14px; font-weight:800; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
        .sec-h .sub { font-size:12.5px; font-weight:700; color:var(--accent-dk); }

        /* ── 문안 카드 ── */
        .entry { border:1px solid var(--line); border-radius:12px; padding:13px 14px; background:#fff; }
        .entry + .entry { margin-top: 8px; }
        .e-main { font-size:17px; font-weight:800; line-height:1.4; letter-spacing:-.3px; white-space:pre-wrap; word-break:keep-all; }
        .e-sub { margin-top:5px; font-size:14px; color:#3a4250; line-height:1.5; white-space:pre-wrap; word-break:keep-all; }
        .e-line { display:flex; gap:8px; align-items:baseline; }
        .e-line + .e-line { margin-top:5px; }
        .e-line .e-sub { margin-top:0; }
        .e-flbl { flex:none; font-size:11px; font-weight:800; color:#5a6b8c; background:#eaeef6; border-radius:5px; padding:2px 7px; line-height:1.5; min-width:36px; text-align:center; }
        .nf-row { display:flex; gap:6px; align-items:center; }
        .nf-row + .nf-row { margin-top:6px; }
        .nf-row .nf-no { flex:none; width:24px; font-size:12px; font-weight:800; color:var(--ink-faint); text-align:center; }
        .nf-row button { flex:none; width:40px; height:42px; border:1px solid var(--line); background:#fff; border-radius:9px; color:var(--ink-soft); font-size:14px; cursor:pointer; }
        .nf-add { margin-top:8px; height:40px; width:100%; background:#fff; color:var(--accent-dk); border:1px dashed #8fb4f3; border-radius:9px; font-size:13px; font-weight:700; cursor:pointer; }
        .e-foot { margin-top:9px; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-faint); font-weight:600; flex-wrap:wrap; }
        .e-by { color:#26344f; font-weight:800; background:#eaeef6; border-radius:5px; padding:2px 7px; }
        .e-by.hidden { background:#f1f3f6; color:var(--ink-faint); font-weight:600; }
        .e-acts { margin-left:auto; display:flex; gap:6px; }
        .e-acts button { height:34px; padding:0 11px; border-radius:7px; border:1px solid var(--line); background:#fff; font-size:12px; font-weight:700; color:var(--ink-soft); cursor:pointer; }
        .e-acts button.del:hover { color:#c5221f; border-color:#e8a19c; }
        .e-no { font-size:11px; font-weight:800; color:var(--ink-faint); }

        /* ── 투표 ── */
        .vote-card { display:flex; gap:12px; align-items:stretch; border:1px solid var(--line); border-radius:12px; padding:13px 14px; background:#fff; cursor:pointer; transition:border-color .15s, background .15s; }
        .vote-card + .vote-card { margin-top:8px; }
        .vote-card:hover { border-color:#8fb4f3; }
        .vote-card.mine { border-color:var(--accent); background:var(--accent-tint); box-shadow:0 0 0 2px rgba(26,115,232,.15); }
        .vote-card.top { border-color:#d8b65a; background:var(--gold-bg); }
        .vote-card.locked { cursor:default; }
        .v-body { flex:1; min-width:0; }
        .v-side { flex:none; width:64px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; border-left:1px solid var(--line-soft); padding-left:10px; }
        .v-num { font-size:24px; font-weight:900; color:#26344f; line-height:1; font-variant-numeric:tabular-nums; }
        .vote-card.mine .v-num { color:var(--accent-dk); }
        .vote-card.top .v-num { color:var(--gold); }
        .v-lbl { font-size:10.5px; font-weight:700; color:var(--ink-faint); }
        .v-pick { font-size:11px; font-weight:800; color:#fff; background:var(--accent); border-radius:999px; padding:2px 8px; }
        .v-rank { font-size:11px; font-weight:800; color:var(--gold); background:#fff; border:1px solid #e9d28a; border-radius:999px; padding:2px 8px; }
        .v-bar { height:5px; background:#eef0f3; border-radius:3px; margin-top:9px; overflow:hidden; }
        .v-bar i { display:block; height:100%; background:var(--accent); border-radius:3px; transition:width .3s; }
        .vote-card.top .v-bar i { background:var(--gold); }
        .vote-sum { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:10px; flex-wrap:wrap; }
        .vote-sum b { color:var(--accent-dk); font-weight:800; }
        .fseg { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr); gap:4px; background:#eef0f3; border-radius:10px; padding:3px; margin-bottom:12px; }
        .fseg button { height:42px; border:none; background:none; border-radius:8px; font-size:14px; font-weight:700; color:var(--ink-soft); cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 6px; }
        .fseg button.on { background:#fff; color:var(--accent-dk); font-weight:800; box-shadow:0 1px 2px rgba(0,0,0,.1); }
        .fs-ok { color:#137333; font-weight:900; }
        .fs-prog { font-size:12px; font-weight:600; color:var(--ink-soft); background:var(--page); border-radius:8px; padding:8px 10px; margin:-2px 0 10px; }
        .fs-prog b { color:var(--accent-dk); font-weight:800; }
        .win-box { background:var(--gold-bg); border:1px solid #e9d28a; border-radius:12px; padding:12px 14px; margin-bottom:4px; }
        .win-h { font-size:13px; font-weight:800; color:var(--gold); margin-bottom:8px; }
        .win-row { display:flex; align-items:baseline; gap:8px; }
        .win-row + .win-row { margin-top:7px; }
        .win-txt { flex:1; min-width:0; font-size:15px; font-weight:800; color:#2a2410; line-height:1.4; word-break:keep-all; }
        .win-n { flex:none; font-size:12px; font-weight:800; color:var(--gold); }
        .vm-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
        .vm-row .vm-l { font-size:12.5px; font-weight:800; color:#6b5210; }
        .admin-box { margin-top:12px; background:#fff9ef; border:1px solid #f0d2a0; border-radius:var(--radius); padding:14px 16px; display:flex; flex-direction:column; gap:9px; }
        .admin-box .ab-h { font-size:13px; font-weight:800; color:var(--warn-ink); }
        .admin-box .ab-d { font-size:12.5px; line-height:1.55; color:#6b5210; }

        /* ── 캡처용 ── */
        .print-head { display:none; }
        .print-head .ph-org { font-size:13px; font-weight:800; color:#5a6b8c; letter-spacing:.1em; display:flex; align-items:center; gap:8px; }
        .print-head .ph-tick { width:4px; height:15px; background:#1a73e8; border-radius:2px; display:inline-block; }
        .print-head .ph-title { font-size:26px; font-weight:900; color:#1f2d4d; letter-spacing:-.02em; margin-top:9px; }
        .print-head .ph-date { font-size:12.5px; color:#8a94a6; margin-top:7px; }
        .print-head .ph-rule { height:3px; background:#1f2d4d; margin:15px 0 18px; position:relative; }
        .print-head .ph-rule::before { content:""; position:absolute; left:0; top:0; width:92px; height:3px; background:#1a73e8; }
        .capture-target { width:760px !important; max-width:760px !important; background:#fff; padding:30px 34px; display:block !important; }
        .capture-target .print-head { display:block !important; }
        .capture-target .no-cap { display:none !important; }
        .capture-target .vote-card { cursor:default; }
        .toast { position:fixed; left:50%; bottom:28px; transform:translate(-50%,12px); background:#1f2d4d; color:#fff; font-size:14px; font-weight:700; padding:12px 18px; border-radius:11px; box-shadow:0 8px 24px rgba(16,24,40,.25); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:9997; max-width:88vw; text-align:center; }
        .toast.show { opacity:1; transform:translate(-50%,0); }
        .img-overlay { position:fixed; inset:0; background:rgba(15,20,30,.78); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding:18px; overflow:auto; }
        .img-overlay .img-card { background:#fff; border-radius:14px; padding:12px; max-width:94vw; box-shadow:0 18px 50px rgba(0,0,0,.4); }
        .img-overlay img { display:block; max-width:100%; height:auto; border-radius:6px; }
        .img-overlay .img-hint { color:#fff; font-size:12.5px; margin:12px 0 4px; text-align:center; line-height:1.6; }
        .img-overlay .img-btns { display:flex; gap:10px; margin-top:14px; }
        .img-overlay .img-btn { font-weight:700; font-size:14px; padding:11px 20px; border-radius:10px; border:none; cursor:pointer; text-decoration:none; }
        .img-overlay .img-dl { background:var(--accent); color:#fff; }
        .img-overlay .img-close { background:rgba(255,255,255,.18); color:#fff; }
        .cap-spin { position:fixed; inset:0; background:rgba(255,255,255,.65); z-index:9998; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; color:var(--ink-soft); }
        details.fold summary { list-style:none; cursor:pointer; min-height:44px; display:flex; align-items:center; justify-content:space-between; font-size:13px; font-weight:800; color:var(--ink-soft); }
        details.fold summary::-webkit-details-marker { display:none; }
        details.fold summary::after { content:"펼치기 ▾"; font-size:12px; font-weight:700; }
        details.fold[open] summary::after { content:"접기 ▴"; }
        .topic-sel { width:100%; height:44px; font-size:14px; font-weight:700; color:#26344f; padding:0 12px; border:1px solid var(--line); border-radius:11px; background:#fcfdfe; }
    </style>
</head>

            'nojohq01@kepco.co.kr':    '김次',
            'nojohq02@kepco.co.kr':    '이課'
        };
        const ADMIN_EMAILS = ['choihosang@kepco.co.kr']; // 공모 열기 · 투표 시작/마감
        const MEMBER_COUNT = Object.keys(EMAIL_TO_MEMBER).length;

        // ── Firebase 경로 (새 경로 — 다른 도구 데이터와 무관) ──
        // contest_2026/current = 주제ID
        // contest_2026/topics/{id} = { title, desc, deadline, fields:['정면','좌측','우측'] (칸 이름 배열, 1~5개), examples:[칸별 예시, 선택], status:'open'|'voting'|'closed'|'canceled', prevStatus(취소 직전 상태), createdBy, createdAt, votingAt, closedAt, canceledAt,
        //                              voteMode:'field'(칸별 투표)|'entry'(세트 투표),
        //                              entries/{eid}:{by, texts:[칸별 문구], at},
        //                              votes/{직책}: eid               ← 세트 투표
        //                              fieldVotes/f{칸번호}/{직책}: eid  ← 칸별 투표 (문안 데이터는 그대로, 표만 칸별로 따로 저장) }
        // (초기 버전 호환: fields:'single'|'pair'+subLabel, entries 의 text/sub 도 읽음)
        const database = firebase.database();
        const rootRef = database.ref('contest_2026');
        const currentRef = rootRef.child('current');
        const topicsRef = rootRef.child('topics');

        let me = null, myEmail = '', isAdmin = false;
        let currentId = null;     // 진행 중 주제
        let viewId = null;        // 보고 있는 주제 (보관함 열람 시 과거 주제)
        let topics = {};          // 전체 주제 캐시
        let sortMode = 'new';
        let editingEntry = null;  // 수정 중인 내 문안 id

        const $ = (id) => document.getElementById(id);
        function escapeHtml(s){ return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
        function pad(n){ return String(n).padStart(2,'0'); }
        function fmtDT(ts){ if(!ts) return ''; const d=new Date(ts); return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
        function fmtDate(iso){ if(!iso) return ''; const p=iso.split('-'); return `${p[0]}. ${p[1]}. ${p[2]}`; }
        let toastTimer = null;
        function showToast(msg){ const el=$('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2200); }

        function topic(){ return (viewId && topics[viewId]) || null; }
        function isCurrent(){ return !!viewId && viewId === currentId; }
        const MAX_FIELDS = 5;
        function fieldsOf(t){
            if(!t) return ['문구'];
            if(Array.isArray(t.fields) && t.fields.length) return t.fields.map(f=>String(f||'').trim()||'문구');
            if(t.fields==='pair') return ['메인 문구', t.subLabel||'서브 문구'];
            return ['문구'];
        }
        function examplesOf(t){ const ex=(t&&Array.isArray(t.examples))?t.examples:[]; return fieldsOf(t).map((f,i)=>String(ex[i]||'').trim()); }
        function textsOf(e){ if(Array.isArray(e.texts)) return e.texts.map(x=>String(x||'').trim()); return [String(e.text||'').trim(), String(e.sub||'').trim()]; }
        function entriesOf(t){ const e=(t&&t.entries)||{}; return Object.keys(e).map(k=>Object.assign({id:k},e[k])).filter(x=>textsOf(x)[0]); }
        // 문안 본문: 칸이 하나면 큰 글씨만, 여러 칸이면 칸 이름 + 글
        function entryBody(e, t){
            const fs = fieldsOf(t), ts = textsOf(e);
            if(fs.length<=1) return `<div class="e-main">${escapeHtml(ts[0])}</div>`;
            return fs.map((f,i)=> !ts[i] ? '' :
                `<div class="e-line"><span class="e-flbl">${escapeHtml(f)}</span><span class="${i===0?'e-main':'e-sub'}">${escapeHtml(ts[i])}</span></div>`).join('');
        }
        function votesOf(t){ return (t&&t.votes)||{}; }
        // 투표 방식: 칸이 하나면 세트, 지정돼 있으면 그대로, 없으면 (기존 세트 표가 있으면 세트 / 없으면 칸별)
        function voteModeOf(t){
            if(!t || fieldsOf(t).length<=1) return 'entry';
            if(t.voteMode==='field' || t.voteMode==='entry') return t.voteMode;
            return Object.keys(t.votes||{}).length ? 'entry' : 'field';
        }
        function fieldVotesOf(t, fi){ return ((t&&t.fieldVotes)||{})['f'+fi] || {}; }
        function fieldCountsOf(t, fi){ const c={}; Object.values(fieldVotesOf(t,fi)).forEach(eid=>{ c[eid]=(c[eid]||0)+1; }); return c; }
        function voterCountOf(t){
            if(voteModeOf(t)!=='field') return Object.keys(votesOf(t)).length;
            const set=new Set(); fieldsOf(t).forEach((f,i)=>Object.keys(fieldVotesOf(t,i)).forEach(k=>set.add(k))); return set.size;
        }
        let voteField = 0; // 칸별 투표에서 보고 있는 칸
        function countsOf(t){ const c={}; Object.values(votesOf(t)).forEach(eid=>{ c[eid]=(c[eid]||0)+1; }); return c; }
        function statusLabel(s){ return s==='voting'?'투표 중':s==='closed'?'마감':s==='canceled'?'취소됨':'제출 받는 중'; }

        // ── 탭 ──
        const TABS=['submit','list','vote'];
        function switchTab(t){
            if(!TABS.includes(t)) t='submit';
            TABS.forEach(k=>{ $('tab-'+k).classList.toggle('active',k===t); $('tabBtn-'+k).classList.toggle('active',k===t); });
            try{ sessionStorage.setItem('contest_tab',t); }catch(e){}
            window.scrollTo(0,0);
        }

        // ── 전체 렌더 ──
        function renderAll(){
            const t = topic();
            const chip = $('stChip');
            if(!t){ chip.className='st-chip'; chip.textContent='공모 없음'; }
            else { chip.className='st-chip '+(t.status||'open'); chip.textContent=(isCurrent()?'':'보관 · ')+statusLabel(t.status); }
            const n = entriesOf(t).length;
            $('cntList').textContent = n;
            $('cntVote').textContent = voterCountOf(t);
            renderTopic(); renderSubmit(); renderMine(); renderList(); renderVote(); renderAdmin();
        }

        function renderTopic(){
            const t = topic(); const el=$('topicCard');
            const past = Object.keys(topics).filter(k=>k!==currentId).sort((a,b)=>(topics[b].createdAt||0)-(topics[a].createdAt||0));
            let picker='';
            if(past.length){
                picker = `<div class="fld" style="margin-top:14px;"><div class="fld-lbl">지난 공모 보기</div><select class="topic-sel" onchange="setView(this.value)">` +
                    `<option value="">${currentId ? '🟢 진행 중 · '+escapeHtml((topics[currentId]||{}).title||'') : '(진행 중인 공모 없음)'}</option>` +
                    past.map(k=>`<option value="${k}" ${k===viewId?'selected':''}>${topics[k].status==='canceled'?'🚫':'🗂'} ${escapeHtml(topics[k].title||k)} · ${statusLabel(topics[k].status)}</option>`).join('') +
                    `</select></div>`;
            }
            if(!t){
                el.innerHTML = `<div class="empty">진행 중인 공모가 없어요.${isAdmin?'<br>아래에서 새 공모를 열 수 있어요.':'<br>총무가 공모를 열면 여기에 표시돼요.'}</div>`+picker;
                return;
            }
            const meta = [];
            if(t.deadline) meta.push(`📅 제출 마감 ${fmtDate(t.deadline)}`);
            const fs = fieldsOf(t);
            meta.push(fs.length>1 ? `✏️ 칸 ${fs.length}개 · ${fs.map(escapeHtml).join(' · ')}` : '✏️ 문구 하나');
            meta.push(voteModeOf(t)==='field' ? `🗳 칸별로 따로 1인 1표 · 득표 실시간 공개 · 제출자는 마감 후 공개` : `🗳 1인 1표 · 득표 실시간 공개 · 제출자는 마감 후 공개`);
            const cancelNote = t.status==='canceled' ? `<div class="notice warn" style="margin-bottom:12px;">🚫 취소된 공모예요${t.canceledAt?' ('+fmtDT(t.canceledAt)+')':''}. 제출 내용만 기록으로 남아 있어요.</div>` : '';
            el.innerHTML = cancelNote + `<div class="topic-h">${escapeHtml(t.title)}</div>` +
                `<div class="topic-meta">${meta.map(m=>`<span>${m}</span>`).join('')}</div>` +
                (t.desc ? `<div class="topic-desc">${escapeHtml(t.desc)}</div>` : '') + picker;
        }
        function setView(id){ viewId = id || currentId; editingEntry=null; renderAll(); }

        function renderSubmit(){
            const t = topic(); const el=$('submitCard');
            if(!t){ el.style.display='none'; return; }
            el.style.display='';
            if(!isCurrent() || t.status!=='open'){
                el.innerHTML = `<div class="notice warn">🔒 ${!isCurrent()?'지난 공모는':'지금은 '+statusLabel(t.status)+' 상태라'} 문안을 새로 낼 수 없어요.</div>`;
                return;
            }
            const ed = editingEntry ? ((t.entries||{})[editingEntry]||null) : null;
            const fs = fieldsOf(t), exs = examplesOf(t); const cur = ed ? textsOf(ed) : [];
            el.innerHTML =
                `<div class="sec-h"><span>${ed?'문안 수정':'문안 제출'}</span><span class="sub">${escapeHtml(me)}</span></div>` +
                fs.map((f,i)=>`<div class="fld"><div class="fld-lbl">${escapeHtml(f)}${i>0?'<span class="opt">(비워도 돼요)</span>':''}</div>` +
                    (exs[i] ? `<div class="fld-ex">예) ${escapeHtml(exs[i])}</div>` : '') +
                    `<textarea class="inp${i===0?' main':''}" id="inF${i}" rows="2">${escapeHtml(cur[i]||'')}</textarea></div>`).join('') +
                `<button type="button" class="btn btn-primary" onclick="submitEntry()">${ed?'수정 저장':'제출하기'}</button>` +
                (ed ? `<button type="button" class="btn btn-ghost" style="width:100%;margin-top:8px;height:44px;" onclick="cancelEdit()">수정 취소</button>` : '') +
                `<div class="notice" style="margin-top:12px;">여러 개 내도 돼요. 제출한 문안은 아래 「내가 낸 문안」에서 투표 시작 전까지 고치거나 지울 수 있어요.</div>`;
        }
        function cancelEdit(){ editingEntry=null; renderSubmit(); }
        function startEdit(id){ editingEntry=id; renderSubmit(); $('inF0').focus(); $('submitCard').scrollIntoView({behavior:'smooth',block:'start'}); }
        function submitEntry(){
            const t = topic(); if(!t || !isCurrent() || t.status!=='open'){ alert('지금은 제출할 수 없어요.'); return; }
            const fs = fieldsOf(t);
            const texts = fs.map((f,i)=>{ const el=$('inF'+i); return el ? (el.value||'').trim() : ''; });
            if(!texts[0]){ alert(`${fs[0]} 칸을 입력해 주세요.`); $('inF0').focus(); return; }
            const eRef = topicsRef.child(viewId).child('entries');
            const p = editingEntry
                ? eRef.child(editingEntry).update({ texts, text:null, sub:null, editedAt: Date.now() })
                : eRef.push({ by: me, texts, at: Date.now() });
            p.then(()=>{ showToast(editingEntry?'수정했어요':'제출했어요'); editingEntry=null; renderSubmit(); })
             .catch(()=>alert('저장에 실패했어요. 네트워크를 확인하고 다시 시도해 주세요.'));
        }
        function removeEntry(id){
            const t = topic(); if(!t || !isCurrent() || t.status!=='open') return;
            const e=(t.entries||{})[id]; if(!e || e.by!==me) return;
            if(!confirm(`이 문안을 지울까요?\n\n${textsOf(e)[0]}`)) return;
            topicsRef.child(viewId).child('entries').child(id).remove().then(()=>{ if(editingEntry===id){ editingEntry=null; renderSubmit(); } showToast('지웠어요'); });
        }

        function entryCard(e, opts){
            opts = opts||{};
            const t = topic();
            const showBy = opts.showBy;
            const byHtml = showBy ? `<span class="e-by">${escapeHtml(e.by)}</span>` : `<span class="e-by hidden">제출자 비공개</span>`;
            const acts = opts.editable ? `<span class="e-acts"><button type="button" onclick="startEdit('${e.id}')">수정</button><button type="button" class="del" onclick="removeEntry('${e.id}')">삭제</button></span>` : '';
            return `<div class="entry">` + entryBody(e, t) +
                `<div class="e-foot">${opts.no?`<span class="e-no">#${opts.no}</span>`:''}${byHtml}<span>${fmtDT(e.at)}${e.editedAt?' · 수정됨':''}</span>${acts}</div>` +
                `</div>`;
        }

        function renderMine(){
            const t = topic(); const el=$('mineCard');
            if(!t){ el.style.display='none'; return; }
            el.style.display='';
            const mine = entriesOf(t).filter(e=>e.by===me).sort((a,b)=>(b.at||0)-(a.at||0));
            const editable = isCurrent() && t.status==='open';
            el.innerHTML = `<div class="sec-h"><span>내가 낸 문안</span><span class="sub">${mine.length?mine.length+'건':''}</span></div>` +
                (mine.length ? mine.map(e=>entryCard(e,{showBy:true,editable})).join('') : `<div class="empty">아직 낸 문안이 없어요.</div>`);
        }

        function setSort(m){ sortMode=m; $('sortNew').classList.toggle('on',m==='new'); $('sortBy').classList.toggle('on',m==='by'); renderList(); }
        function renderList(){
            const t = topic(); const el=$('listBody');
            if(!t){ $('listSum').textContent=''; el.innerHTML=`<div class="empty">진행 중인 공모가 없어요.</div>`; return; }
            const all = entriesOf(t);
            const people = new Set(all.map(e=>e.by)).size;
            $('listSum').textContent = `${all.length}건 · ${people}명 제출`;
            const showBy = t.status==='closed';
            // 제출자 비공개 상태에서는 '제출자별' 정렬도 이름 없이 묶이기만 함
            let arr = all.slice();
            if(sortMode==='by') arr.sort((a,b)=> (a.by===b.by ? (b.at||0)-(a.at||0) : a.by.localeCompare(b.by,'ko')));
            else arr.sort((a,b)=>(b.at||0)-(a.at||0));
            if(!arr.length){ el.innerHTML=`<div class="empty">아직 제출된 문안이 없어요.</div>`; return; }
            if(sortMode==='by' && !showBy){
                // 이름 대신 '제출자 A/B/…'로 묶음 (순서는 제출 순)
                const order=[]; all.slice().sort((a,b)=>(a.at||0)-(b.at||0)).forEach(e=>{ if(!order.includes(e.by)) order.push(e.by); });
                const label = (by)=> by===me ? '나' : '제출자 '+String.fromCharCode(65+order.indexOf(by));
                arr.sort((a,b)=> order.indexOf(a.by)-order.indexOf(b.by) || (b.at||0)-(a.at||0));
                let html='', last=null;
                arr.forEach(e=>{ if(e.by!==last){ last=e.by; html+=`<div class="sec-h" style="margin:14px 0 8px;"><span>${label(e.by)}</span></div>`; } html+=entryCard(e,{showBy:e.by===me}); });
                el.innerHTML = html; return;
            }
            el.innerHTML = arr.map((e,i)=>entryCard(e,{showBy: showBy || e.by===me, no: arr.length-i})).join('');
        }

        function renderVote(){
            const t = topic(); const el=$('voteBody');
            if(!t){ el.innerHTML=`<div class="empty">진행 중인 공모가 없어요.</div>`; return; }
            const st = t.status||'open';
            const all = entriesOf(t);
            const counts = countsOf(t);
            const votes = votesOf(t);
            const myPick = votes[me] || null;
            const total = Object.keys(votes).length;
            $('phTitle').textContent = `${t.title} · 투표 결과`;
            $('phDate').textContent = t.closedAt ? `마감 ${fmtDT(t.closedAt)} · ${total}명 참여` : '';
            if(st==='canceled'){
                el.innerHTML = `<div class="empty">취소된 공모라 투표 결과가 없어요.</div>`;
                return;
            }
            if(st==='open'){
                el.innerHTML = `<div class="empty">아직 투표가 시작되지 않았어요.<br>지금까지 <b>${all.length}건</b> 제출됐어요.${isAdmin&&isCurrent()?'<br>아래에서 투표를 시작할 수 있어요.':''}</div>`;
                return;
            }
            if(!all.length){ el.innerHTML=`<div class="empty">제출된 문안이 없어요.</div>`; return; }
            if(voteModeOf(t)==='field'){ renderVoteByField(t, el); return; }
            const closed = st==='closed';
            // 투표 중: 제출 순서 고정(먼저 올라온 순) / 마감 후: 득표순
            let arr = all.slice().sort((a,b)=>(a.at||0)-(b.at||0));
            if(closed) arr.sort((a,b)=>(counts[b.id]||0)-(counts[a.id]||0) || (a.at||0)-(b.at||0));
            const max = Math.max(1, ...arr.map(e=>counts[e.id]||0));
            const topN = closed ? (counts[arr[0].id]||0) : 0;
            const sum = closed
                ? `<div class="vote-sum"><span>마감 · <b>${total}명</b> 참여 · 득표순</span><button type="button" class="btn btn-ghost no-cap" onclick="saveResultImage()">🖼 결과 이미지 저장</button></div>`
                : `<div class="vote-sum"><span><b>${total}명</b> 참여 중 / ${MEMBER_COUNT}명</span><span>${myPick?'✅ 투표했어요 · 다른 문안을 누르면 바뀌어요':'문안을 눌러 한 표를 주세요'}</span></div>`;
            el.innerHTML = sum + arr.map((e,i)=>{
                const c = counts[e.id]||0;
                const mine = myPick===e.id;
                const top = closed && topN>0 && c===topN;
                const rank = closed ? `<span class="v-rank">${i+1}위</span>` : '';
                return `<div class="vote-card${mine?' mine':''}${top?' top':''}${closed?' locked':''}" ${closed?'':`onclick="castVote('${e.id}')" role="button" tabindex="0"`}>` +
                    `<div class="v-body">${entryBody(e, t)}` +
                    `<div class="e-foot">${rank}${closed?`<span class="e-by">${escapeHtml(e.by)}</span>`:`<span class="e-by hidden">제출자 비공개</span>`}${mine&&!closed?'<span class="v-pick">내 표</span>':''}</div>` +
                    `<div class="v-bar"><i style="width:${Math.round(c/max*100)}%"></i></div></div>` +
                    `<div class="v-side"><span class="v-num">${c}</span><span class="v-lbl">표</span></div>` +
                    `</div>`;
            }).join('');
        }
        // ── 칸별 투표 ──
        function fieldCard(t, e, fi, c, max, closed, mine, top, rank){
            const txt = textsOf(e)[fi];
            return `<div class="vote-card${mine?' mine':''}${top?' top':''}${closed?' locked':''}" ${closed?'':`onclick="castFieldVote(${fi},'${e.id}')" role="button" tabindex="0"`}>` +
                `<div class="v-body"><div class="e-main">${escapeHtml(txt)}</div>` +
                `<div class="e-foot">${rank?`<span class="v-rank">${rank}위</span>`:''}${closed?`<span class="e-by">${escapeHtml(e.by)}</span>`:`<span class="e-by hidden">제출자 비공개</span>`}${mine&&!closed?'<span class="v-pick">내 표</span>':''}</div>` +
                `<div class="v-bar"><i style="width:${Math.round(c/max*100)}%"></i></div></div>` +
                `<div class="v-side"><span class="v-num">${c}</span><span class="v-lbl">표</span></div>` +
                `</div>`;
        }
        function renderVoteByField(t, el){
            const fs = fieldsOf(t), closed = t.status==='closed';
            const all = entriesOf(t).slice().sort((a,b)=>(a.at||0)-(b.at||0)); // 투표 중엔 제출 순 고정
            const cands = (fi)=> all.filter(e=>textsOf(e)[fi]);
            if(voteField<0 || voteField>=fs.length) voteField = 0;
            if(!closed){
                const fi = voteField;
                const seg = `<div class="fseg no-cap">` + fs.map((f,i)=>{
                    const voted = !!fieldVotesOf(t,i)[me];
                    return `<button type="button" class="${i===fi?'on':''}" onclick="setVoteField(${i})">${escapeHtml(f)}${voted?' <span class="fs-ok">✓</span>':''}</button>`;
                }).join('') + `</div>`;
                const list = cands(fi), counts = fieldCountsOf(t,fi), myPick = fieldVotesOf(t,fi)[me]||null;
                const nVoters = Object.keys(fieldVotesOf(t,fi)).length;
                const done = fs.filter((f,i)=>fieldVotesOf(t,i)[me]).length;
                const max = Math.max(1, ...list.map(e=>counts[e.id]||0));
                const sum = `<div class="vote-sum"><span>${escapeHtml(fs[fi])} · <b>${nVoters}명</b> 참여 / ${MEMBER_COUNT}명</span><span>${myPick?'✅ 이 칸 투표했어요 · 다른 문안을 누르면 바뀌어요':'문안을 눌러 한 표를 주세요'}</span></div>` +
                    `<div class="fs-prog">칸마다 따로 한 표씩 · 내 투표 <b>${done}/${fs.length}칸</b>${done<fs.length?' — 위에서 칸을 바꿔 계속 투표하세요':' 완료'}</div>`;
                el.innerHTML = seg + sum + (list.length
                    ? list.map(e=>fieldCard(t, e, fi, counts[e.id]||0, max, false, myPick===e.id, false, 0)).join('')
                    : `<div class="empty">이 칸에 들어온 문안이 없어요.</div>`);
                return;
            }
            // 마감: 칸별 1위 요약 + 칸마다 득표순
            const total = voterCountOf(t);
            let winners = '', sections = '';
            fs.forEach((f,fi)=>{
                const counts = fieldCountsOf(t,fi);
                const list = cands(fi).sort((a,b)=>(counts[b.id]||0)-(counts[a.id]||0) || (a.at||0)-(b.at||0));
                const nV = Object.keys(fieldVotesOf(t,fi)).length;
                const topN = list.length ? (counts[list[0].id]||0) : 0;
                const tops = topN>0 ? list.filter(e=>(counts[e.id]||0)===topN) : [];
                winners += `<div class="win-row"><span class="e-flbl">${escapeHtml(f)}</span><span class="win-txt">${tops.length ? tops.map(e=>escapeHtml(textsOf(e)[fi])).join(' / ') : '<span style="color:var(--ink-faint)">득표 없음</span>'}</span>${tops.length?`<span class="win-n">${topN}표${tops.length>1?' · 동점':''}</span>`:''}</div>`;
                const max = Math.max(1, topN);
                sections += `<div class="sec-h" style="margin:18px 0 8px;"><span>${escapeHtml(f)}</span><span class="sub">${nV}명 참여</span></div>` +
                    (list.length ? list.map((e,i)=>{ const c=counts[e.id]||0; return fieldCard(t, e, fi, c, max, true, false, topN>0 && c===topN, i+1); }).join('')
                                 : `<div class="empty">이 칸에 들어온 문안이 없어요.</div>`);
            });
            el.innerHTML = `<div class="vote-sum"><span>마감 · <b>${total}명</b> 참여 · 칸별 득표순</span><button type="button" class="btn btn-ghost no-cap" onclick="saveResultImage()">🖼 결과 이미지 저장</button></div>` +
                `<div class="win-box"><div class="win-h">칸별 1위</div>${winners}</div>` + sections;
        }
        function setVoteField(i){ voteField = i; renderVote(); }
        function castFieldVote(fi, eid){
            const t = topic(); if(!t || !isCurrent() || t.status!=='voting' || voteModeOf(t)!=='field') return;
            const ref = topicsRef.child(viewId).child('fieldVotes').child('f'+fi).child(me);
            const cur = fieldVotesOf(t,fi)[me];
            const f = fieldsOf(t)[fi];
            if(cur===eid){ if(confirm(`${f} 칸에 준 표를 거둘까요?`)) ref.remove().then(()=>showToast('표를 거뒀어요')); return; }
            ref.set(eid).then(()=>{
                showToast(`${f} ${cur?'표를 옮겼어요':'투표했어요'}`);
                // 아직 투표 안 한 다음 칸으로 안내
                const t2 = topic(); const fs = fieldsOf(t2);

            }).catch(()=>alert('투표에 실패했어요. 다시 시도해 주세요.'));

        function setVoteMode(m){

            }
            topicsRef.child(viewId).update({ voteMode: m }).then(()=>showToast(m==='field'?'칸별 투표로 바꿨어요':'세트 투표로 바꿨어요'));
        }
        function castVote(eid){

            if(cur===eid){ if(confirm('이 문안에 준 표를 거둘까요?')) topicsRef.child(viewId).child('votes').child(me).remove().then(()=>showToast('표를 거뒀어요')); return; }
            topicsRef.child(viewId).child('votes').child(me).set(eid).then(()=>showToast(cur?'표를 옮겼어요':'투표했어요')).catch(()=>alert('투표에 실패했어요. 다시 시도해 주세요.'));

        // ── 총무 전용 ──

                  `<div class="ab-d">실수로 취소했으면 되돌릴 수 있어요. 제출된 문안${t.prevStatus==='voting'?'과 표':''}가 그대로 다시 진행돼요.${active?' 지금 진행 중인 공모는 지난 공모로 보관돼요.':''}</div>` +

            sub.innerHTML = restore + manage + `<div class="admin-box"><div class="ab-h">총무 · 새 공모</div>` +

                `</div>`;
            renderNewFields();

            const vmSeg = multi
                ? `<div class="vm-row"><span class="vm-l">투표 방식</span><div class="seg"><button type="button" class="${vm==='field'?'on':''}" onclick="setVoteMode('field')">칸별 따로</button><button type="button" class="${vm==='entry'?'on':''}" onclick="setVoteMode('entry')">세트로</button></div></div>` +
                  `<div class="ab-d">${vm==='field'?`${fieldsOf(t).map(escapeHtml).join(' · ')} 칸마다 따로 한 표씩 줘요. 칸별로 1위가 나와요.`:'칸을 묶은 문안 한 세트에 한 표를 줘요.'}</div>`

                vt.innerHTML = `<div class="admin-box"><div class="ab-h">총무 · 투표 시작</div>${vmSeg}<div class="ab-d">시작하면 문안 제출·수정이 잠기고 투표가 열려요. 득표 수는 실시간으로 보이고, 제출자는 마감 후 공개돼요.</div>` +
                    `<button type="button" class="btn btn-warn" onclick="setStatus('voting')" ${n?'':'disabled style="opacity:.5"'}>투표 시작 (${n}건)</button></div>`;

        // 새 공모 폼 입력값 (화면 안에서만 유지 — 실시간 갱신으로 다시 그려져도 안 날아가게)
        let draft = { title:'', desc:'', deadline:'', from:'', voteMode:'field' };
        function setDraftVm(m){ draft.voteMode = m; const a=$('nVmField'), b=$('nVmEntry'); if(a) a.classList.toggle('on', m!=='entry'); if(b) b.classList.toggle('on', m==='entry'); }
        let newFields = [{ name:'문구', ex:'' }];
        function resetDraft(){ draft = { title:'', desc:'', deadline:'', from:'', voteMode:'field' }; newFields = [{ name:'문구', ex:'' }]; }
        function prefillFrom(t){
            const exs = examplesOf(t);
            draft = { title: t.title||'', desc: t.desc||'', deadline: t.deadline||'', from: t.title||'', voteMode: voteModeOf(t)==='entry' && fieldsOf(t).length>1 ? 'entry' : 'field' };
            newFields = fieldsOf(t).map((f,i)=>({ name:f, ex: exs[i]||'' }));
        }
        function cancelTopic(){
            const t = topic(); if(!isAdmin || !t || !isCurrent()) return;
            const st = t.status||'open'; if(st!=='open' && st!=='voting') return;
            const n = entriesOf(t).length, v = voterCountOf(t);
            const msg = `「${t.title}」 공모를 취소할까요?\n\n` +
                `• 모든 사람 화면에서 공모가 내려가요\n` +
                `• 제출 ${n}건${v?` · 투표 ${v}명`:''}은 지우지 않고 '지난 공모'에 취소됨으로 남아요\n` +
                `• 같은 설정을 새 공모 칸에 채워둘게요 — 고쳐서 다시 열면 돼요`;
            if(!confirm(msg)) return;
            const id = viewId, upd = {};
            upd[`topics/${id}/status`] = 'canceled';
            upd[`topics/${id}/prevStatus`] = st;
            upd[`topics/${id}/canceledAt`] = Date.now();

                prefillFrom(t); editingEntry=null; viewId=null; renderAll();

                setTimeout(()=>{ const box=$('adminSubmit'); if(box) box.scrollIntoView({behavior:'smooth',block:'start'}); }, 80);
            }).catch(()=>alert('취소에 실패했어요. 네트워크를 확인하고 다시 시도해 주세요.'));
        }
        function restoreTopic(){
            const t = topic(); if(!isAdmin || !t || t.status!=='canceled') return;

            const curActive = cur && cur.status!=='closed' && cur.status!=='canceled';
            let msg = `「${t.title}」 공모 취소를 되돌릴까요?\n제출된 문안${t.prevStatus==='voting'?'과 표':''}가 그대로 다시 진행돼요.`;

        function readNewFields(){ const arr=[]; document.querySelectorAll('#nFieldsBox .nf-block').forEach(b=>{ const n=b.querySelector('input[id^="nF"]'), e=b.querySelector('input[id^="nE"]'); arr.push({ name: n?n.value:'', ex: e?e.value:'' }); }); if(arr.length) newFields=arr; }
        function renderNewFields(){

        function removeNewField(i){ readNewFields(); if(newFields.length<=1) return; newFields.splice(i,1); renderNewFields(); }
        function createTopic(){
            if($('nTitle')) draft.title=$('nTitle').value; if($('nDesc')) draft.desc=$('nDesc').value; if($('nDead')) draft.deadline=$('nDead').value;
            const title=(draft.title||'').trim(); if(!title){ alert('공모 제목을 입력해 주세요.'); return; }

            const kept = newFields.map(f=>({ name:String(f.name||'').trim(), ex:String(f.ex||'').trim() })).filter(f=>f.name).slice(0,MAX_FIELDS);
            if(!kept.length){ alert('문안 칸 이름을 하나 이상 적어 주세요.'); return; }
            const fields = kept.map(f=>f.name), examples = kept.map(f=>f.ex);

               .then(()=>currentRef.set(ref.key)).then(()=>{ viewId=ref.key; editingEntry=null; resetDraft(); renderAll(); showToast('새 공모를 열었어요'); switchTab('submit'); })
               .catch(()=>alert('공모 생성에 실패했어요.'));

        function setStatus(s){
            const t=topic(); if(!t||!isCurrent()) return;
            const msgs = { voting: t.status==='closed'?'투표를 다시 열까요? (기존 표는 그대로 남아요)':'투표를 시작할까요?\n이후엔 문안을 내거나 고칠 수 없어요.', closed:'투표를 마감할까요?', open:'투표를 취소하고 제출 단계로 돌아갈까요?\n지금까지의 표는 모두 지워져요.' };
            if(!confirm(msgs[s])) return;
            const upd = { status:s };
            if(s==='voting' && t.status==='open') upd.votingAt = Date.now();

        }

        // ── 결과 이미지 (duty.html 방식) ──
        function dataURLtoFile(dataurl, filename){ const arr=dataurl.split(','), mime=arr[0].match(/:(.*?);/)[1], bstr=atob(arr[1]); let n=bstr.length; const u8=new Uint8Array(n); while(n--) u8[n]=bstr.charCodeAt(n); return new File([u8],filename,{type:mime}); }
        function isMobileShare(){ const ua=navigator.userAgent||''; const ios=/iPhone|iPad|iPod/.test(ua)||(navigator.maxTouchPoints>1&&/Macintosh/.test(ua)); return (ios||/Android/.test(ua)) && !!navigator.canShare; }
        async function saveResultImage(){
            if(typeof html2canvas==='undefined'){ alert('이미지 모듈을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.'); return; }
            const t=topic(); if(!t) return;
            const spin=document.createElement('div'); spin.className='cap-spin'; spin.textContent='이미지 만드는 중…'; document.body.appendChild(spin);
            let dataUrl=null;
            try{
                const clone=$('voteArea').cloneNode(true); clone.classList.add('capture-target');
                const holder=document.createElement('div'); holder.style.cssText='position:fixed; left:-12000px; top:0;'; holder.appendChild(clone); document.body.appendChild(holder);
                await new Promise(r=>setTimeout(r,60));
                const canvas=await html2canvas(clone,{scale:2.5,backgroundColor:'#ffffff',useCORS:true,logging:false});
                document.body.removeChild(holder); dataUrl=canvas.toDataURL('image/png');
            }catch(e){ spin.remove(); alert('이미지 생성에 실패했어요.'); return; }
            spin.remove();
            const filename=`문구공모_결과.png`, title=`${t.title} 투표 결과`;
            try{ const file=dataURLtoFile(dataUrl,filename); if(isMobileShare()&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title}); return; } }
            catch(e){ if(e&&e.name==='AbortError') return; }
            const file=dataURLtoFile(dataUrl,filename); const canShare=isMobileShare()&&navigator.canShare({files:[file]});
            const ov=document.createElement('div'); ov.className='img-overlay';
            ov.innerHTML=`<div class="img-hint">${canShare?'아래 버튼 → "이미지 저장"':'아래 「이미지 저장」을 누르면 PNG로 다운로드돼요.'}</div><div class="img-card"><img src="${dataUrl}" alt="미리보기"></div>`+
                `<div class="img-btns">${canShare?`<button class="img-btn img-dl" id="imgShare">사진에 저장 · 공유</button>`:`<a class="img-btn img-dl" href="${dataUrl}" download="${filename}">이미지 저장</a>`}<button class="img-btn img-close">닫기</button></div>`;
            ov.addEventListener('click',(e)=>{ if(e.target===ov||e.target.classList.contains('img-close')) ov.remove(); });
            document.body.appendChild(ov);
            if(canShare) $('imgShare').addEventListener('click', async()=>{ try{ await navigator.share({files:[file],title}); }catch(e){} });
        }

        // ── 시작 ──
        onAuthReady(function(user){
            myEmail=(user.email||'').toLowerCase();
            me = EMAIL_TO_MEMBER[myEmail] || null;
            isAdmin = ADMIN_EMAILS.includes(myEmail);
            if(!me){ document.querySelector('.wrap').innerHTML='<div class="card pad empty">이 계정은 집행부 직책에 연결돼 있지 않아요.<br>총무에게 문의해 주세요.</div>'; return; }
            let savedTab='submit'; try{ savedTab=sessionStorage.getItem('contest_tab')||'submit'; }catch(e){}
            switchTab(savedTab);
            currentRef.on('value',(snap)=>{
                const v=snap.val(); const prev=currentId; currentId=(typeof v==='string')?v:null;
                // 진행 중 공모를 보고 있었으면 새 공모로 따라감, 지난 공모를 보고 있었으면 그대로
                if(!viewId || !topics[viewId] || viewId===prev || !currentId) viewId=currentId;
                renderAll();
            });
            topicsRef.on('value',(snap)=>{
                topics=snap.val()||{};
                if(!viewId || !topics[viewId]) viewId=currentId;
                // 입력 중이면 입력칸을 다시 그리지 않음 (다른 사람 제출로 내 글이 날아가지 않게)
                const ae=document.activeElement; const typing = ae && /^(inF\d|nF\d|nE\d|nTitle|nDesc|nDead)$/.test(ae.id||'');
                if(typing){ const t=topic(); $('cntList').textContent=entriesOf(t).length; $('cntVote').textContent=voterCountOf(t); renderMine(); renderList(); renderVote(); }
                else renderAll();
            });
        });
    </script>
</body>
</html>
