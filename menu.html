<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메뉴 고르기 · 전력노조 집행부</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <style>
        :root {
            --blue: #1a73e8; --blue-dk: #1557b0;
            --ink: #202124; --ink2: #5f6368; --faint: #9aa6b2;
            --line: #dadce0; --line2: #e8eaed;
            --bg: #f1f3f4; --white: #fff;
            --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard','Malgun Gothic',sans-serif; background: var(--bg); color: var(--ink); padding-bottom: 70px; -webkit-font-smoothing: antialiased; letter-spacing: -.01em; }

        .topbar { background: var(--white); border-bottom: 1px solid var(--line); padding: 0 18px; height: 54px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; }
        .back-btn { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink2); font-size: 13.5px; font-weight: 600; padding: 7px 11px; border-radius: 8px; }
        .back-btn:hover { background: var(--bg); color: var(--blue); }
        .crumb { font-size: 14px; font-weight: 800; }

        .wrap { max-width: 720px; margin: 0 auto; padding: 22px 16px; }

        .page-head { margin-bottom: 18px; }
        .page-head .rname { font-size: 22px; font-weight: 800; letter-spacing: -.5px; }
        .page-head .rloc { font-size: 13px; color: var(--ink2); margin-top: 3px; }

        .panel { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; }
        .panel-h { font-size: 14px; font-weight: 800; margin-bottom: 14px; display: flex; align-items: center; gap: 7px; }
        .panel-h .ico { font-size: 16px; }

        label.fl { display: block; font-size: 12px; font-weight: 700; color: var(--ink2); margin-bottom: 5px; }
        input[type=text], select {
            width: 100%; padding: 10px 12px; font-family: inherit; font-size: 14px;
            border: 1px solid var(--line); border-radius: 9px; background: var(--white); color: var(--ink);
        }
        input:focus, select:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px #e8f0fe; }
        .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
        @media (max-width: 560px){ .row2 { grid-template-columns: 1fr; } }

        .btn { padding: 10px 16px; font-family: inherit; font-size: 13.5px; font-weight: 700; border-radius: 8px; cursor: pointer; border: none; }
        .btn-pri { background: var(--blue); color: #fff; }
        .btn-pri:hover { background: var(--blue-dk); }
        .btn-line { background: var(--white); color: var(--blue); border: 1px solid var(--line); }
        .btn-line:hover { background: #f5f9ff; }
        .btn-reset { background: #fff; color: #c5221f; border: 1px solid #f0c8c3; font-size: 12.5px; padding: 8px 14px; }
        .btn-reset:hover { background: #fdf1ef; }

        /* 메뉴 항목 추가/관리 */
        .add-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .add-row input { flex: 1; }
        .item-list { display: flex; flex-direction: column; gap: 7px; }
        .item-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 12px; background: #f8fafc; border: 1px solid var(--line2); border-radius: 9px; font-size: 14px; font-weight: 600; }
        .item-x { background: #fdecea; color: #c5221f; border: none; width: 24px; height: 24px; border-radius: 7px; cursor: pointer; font-size: 12px; font-weight: 700; flex-shrink: 0; }
        .item-x:hover { background: #f7c9c3; }
        .empty { color: var(--faint); font-size: 13px; padding: 6px 2px; }

        /* ⭐ 즐겨찾기 */
        .fav-list { display: flex; flex-direction: column; gap: 9px; }
        .fav-card { border: 1px solid var(--line); border-radius: 11px; overflow: hidden; }
        .fav-card.editing { border-color: var(--blue); }
        .fav-main { display: flex; align-items: center; gap: 8px; padding: 12px 13px; }
        .fav-info { flex: 1; min-width: 0; }
        .fav-name { font-size: 15px; font-weight: 800; letter-spacing: -.2px; }
        .fav-sub { font-size: 12px; color: var(--ink2); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .fav-load { flex-shrink: 0; padding: 8px 13px; font-size: 12.5px; font-weight: 700; border-radius: 999px; border: 1px solid var(--blue); background: var(--blue); color: #fff; cursor: pointer; font-family: inherit; white-space: nowrap; }
        .fav-load:hover { background: var(--blue-dk); }
        .fav-btn { flex-shrink: 0; width: 32px; height: 32px; border: 1px solid var(--line); background: var(--white); border-radius: 8px; cursor: pointer; font-size: 13px; font-family: inherit; line-height: 1; }
        .fav-btn:hover { background: #f5f9ff; border-color: var(--blue); }
        .fav-btn.del:hover { background: #fdf1ef; border-color: #f0c8c3; }
        .fav-edit { border-top: 1px solid var(--line2); background: #f8fafc; padding: 14px 13px; }
        .fav-edit .fe-row { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
        .fav-edit .fe-row input { flex: 1; }
        .fav-edit .fe-actions { display: flex; gap: 8px; margin-top: 13px; }
        .fav-hint { font-size: 12.5px; color: var(--ink2); line-height: 1.6; padding: 2px 1px; }
        .fav-hint b { color: var(--blue); font-weight: 800; }

        /* 메뉴 고르기 & 현황 */
        .choose-list { display: flex; flex-direction: column; gap: 10px; }
        .choose-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px; transition: border-color .15s, background .15s; }
        .choose-row.mine { border-color: var(--blue); background: #f4f9ff; }
        .ci-info { min-width: 0; }
        .ci-name { font-size: 15px; font-weight: 700; }
        .ci-tally { font-size: 12px; color: var(--ink2); margin-top: 3px; line-height: 1.45; }
        .ci-tally .cnt { color: var(--blue); font-weight: 700; }
        .pick-btn { flex-shrink: 0; padding: 8px 14px; font-size: 13px; font-weight: 700; border-radius: 999px; border: 1px solid var(--line); background: var(--white); color: var(--ink2); cursor: pointer; white-space: nowrap; }
        .pick-btn.on { background: var(--blue); color: #fff; border-color: var(--blue); }

        .total-line { margin-top: 14px; font-size: 13px; font-weight: 700; color: var(--ink); text-align: right; }
        .foot-actions { display: flex; justify-content: flex-end; margin-top: 8px; }

        /* 기타 (직접 입력) */
        .etc-box { margin-top: 12px; padding: 13px 14px; border: 1px dashed #a9c6f5; border-radius: 12px; background: #f8fbff; }

        /* 내 선택 배지 */
        .my-pick {
            display: flex; align-items: center; gap: 9px;
            background: #e8f0fe; border: 1px solid #c2dbff; border-radius: 11px;
            padding: 12px 14px; margin-bottom: 14px;
        }
        .my-pick .mp-lbl { font-size: 12px; font-weight: 700; color: var(--blue); flex-shrink: 0; }
        .my-pick .mp-name { font-size: 15px; font-weight: 800; color: var(--ink); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .my-pick.none { background: #f8f9fa; border-color: var(--line2); }
        .my-pick.none .mp-lbl { color: var(--ink2); }
        .my-pick.none .mp-name { color: var(--faint); font-weight: 600; font-size: 14px; }

        /* 저장 완료 토스트 */
        #toast {
            position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(10px);
            background: #202124; color: #fff; font-size: 14px; font-weight: 700;
            padding: 13px 22px; border-radius: 999px; z-index: 999;
            box-shadow: 0 8px 26px rgba(0,0,0,.28); max-width: 88%; text-align: center;
            opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .etc-head { font-size: 13px; font-weight: 700; color: var(--blue); margin-bottom: 9px; display: flex; align-items: center; gap: 6px; }
        .etc-row { display: flex; gap: 8px; }
        .etc-row input { flex: 1; }
        .etc-hint { font-size: 11.5px; color: var(--ink2); margin-top: 7px; line-height: 1.5; }

        /* 화면 전환 */
        .hidden { display: none !important; }
        .btn-go { width: 100%; padding: 14px; font-size: 15px; border-radius: 10px; margin-top: 2px; }
        /* 고르기 화면 상단: 접힌 식당 정보 */
        .rest-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; }
        .rest-bar .rb-name { font-size: 18px; font-weight: 800; letter-spacing: -.3px; }
        .rest-bar .rb-loc { font-size: 12.5px; color: var(--ink2); margin-top: 2px; }
        .rest-bar .rb-edit { flex-shrink: 0; background: #f1f3f4; color: var(--ink2); border: none; border-radius: 8px; padding: 9px 12px; font-size: 12.5px; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap; }
        .rest-bar .rb-edit:hover { background: #e6e9ec; color: var(--blue); }
    </style>
</head>
<body>

    <div class="topbar">
        <a class="back-btn" href="index.html">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            업무포털
        </a>
        <span class="crumb">메뉴 고르기</span>
    </div>

    <div class="wrap">

        <!-- ===== 설정 화면 : 식당 + 메뉴 넣는 사람용 ===== -->
        <div id="setupView">

            <div class="page-head">
                <div class="rname" id="rName">식당 미정</div>
                <div class="rloc" id="rLoc" style="display:none;"></div>
            </div>

            <!-- 0. 즐겨찾기 -->
            <div class="panel">
                <div class="panel-h"><span class="ico">⭐</span>즐겨찾기 &middot; 자주 가는 식당</div>
                <div class="fav-list" id="favList"></div>
            </div>

            <!-- 1. 식당 정보 -->
            <div class="panel">
                <div class="panel-h"><span class="ico">🍽️</span>식당 정보</div>
                <div class="row2">
                    <div>
                        <label class="fl">식당 이름</label>
                        <input type="text" id="inName" placeholder="예: 본사앞 김치찌개">
                    </div>
                    <div>
                        <label class="fl">위치 (선택)</label>
                        <input type="text" id="inLoc" placeholder="예: 1층 / 도보 5분">
                    </div>
                </div>
                <button class="btn btn-pri" onclick="saveRestaurant()">식당 저장</button>
            </div>

            <!-- 2. 메뉴 항목 -->
            <div class="panel">
                <div class="panel-h"><span class="ico">📝</span>메뉴 항목</div>
                <div class="add-row">
                    <input type="text" id="inItem" placeholder="메뉴 이름 입력 (예: 김치찌개)" onkeydown="if(event.key==='Enter')addItem()">
                    <button class="btn btn-pri" onclick="addItem()">추가</button>
                </div>
                <div class="item-list" id="itemManage"></div>
            </div>

            <button class="btn btn-pri btn-go" onclick="finishSetup()">✅ 입력 완료 · 고르기 화면으로</button>
        </div>

        <!-- ===== 고르기 화면 : 메뉴 고르는 사람용 ===== -->
        <div id="chooseView">

            <div class="rest-bar">
                <div class="rest-bar-info">
                    <div class="rb-name" id="rbName">🍽️ 식당 미정</div>
                    <div class="rb-loc" id="rbLoc" style="display:none;"></div>
                </div>
                <button class="rb-edit" onclick="setView('setup')">✏️ 식당·메뉴 수정</button>
            </div>

            <div class="panel">
                <div class="panel-h"><span class="ico">✅</span>메뉴 고르기 &amp; 현황</div>
                <label class="fl">내 직책 선택</label>
                <select id="memberSelect" onchange="renderChoose()" style="margin-bottom:14px;"></select>
                <div id="myPick"></div>
                <div class="choose-list" id="chooseList"></div>

                <div class="etc-box">
                    <div class="etc-head"><span>✏️</span>기타 · 직접 입력</div>
                    <div class="etc-row">
                        <input type="text" id="etcItem" placeholder="먹고 싶은 메뉴 입력" onkeydown="if(event.key==='Enter')addCustomAndSelect()">
                        <button class="btn btn-pri" onclick="addCustomAndSelect()">추가 · 선택</button>
                    </div>
                    <div class="etc-hint">목록에 없는 메뉴는 여기 입력하면 바로 추가되고 내 선택으로 등록돼요.</div>
                </div>

                <div class="total-line" id="totalLine"></div>
                <div class="foot-actions">
                    <button class="btn btn-reset" onclick="resetAll()">전체 초기화 (다음 끼)</button>
                </div>
            </div>
        </div>

    </div>

    <div id="toast"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDUFwsNEBzTZxr8EJuY2BZkYTEBadQoMk8",
            authDomain: "knewu-64318.firebaseapp.com",
            databaseURL: "https://knewu-64318-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "knewu-64318",
            storageBucket: "knewu-64318.firebasestorage.app",
            messagingSenderId: "301755569133",
            appId: "1:301755569133:web:9bd85133d084c041368de4"
        };
        firebase.initializeApp(firebaseConfig);

        // 🔐 로그인 확인: 로그인 안 되어 있으면 로그인 페이지로 이동
        function onAuthReady(callback) {
            firebase.auth().onAuthStateChanged(function (user) {
                if (!user) {
                    try { sessionStorage.setItem('knewu_redirect', window.location.href); } catch (e) {}
                    window.location.href = 'login.html';
                    return;
                }
                callback(user);
            });
        }

        const db = firebase.database();
        const ref = db.ref('meal_order');
        // ⭐ 즐겨찾기는 별도 경로 — 「전체 초기화」가 meal_order를 통째로 지워도 살아남습니다
        const favRef = db.ref('meal_order_favorites');

        const MEMBERS = [
            "위원장","수석부위원장","사무처장","기획처장","대외협력본부장","총무국장",
            "조직쟁의실장","기획국장","정책국장","복지국장","산업안전국장","교육문화국장",
            "손혜석과장","홍수정부장","김종찬차장","이경현과장"
        ];

        let state = {};
        let viewMode = null; // 'setup' | 'choose' (첫 로딩 시 데이터 보고 자동 결정)
        let favs = {};          // 즐겨찾기 목록 {키: {name, location, items:[이름...]}}
        let favEditKey = null;  // 인라인 편집 중인 즐겨찾기 키
        let favDraft = null;    // 편집 중인 값 버퍼 {name, location, items:[]}

        // 직책 드롭다운 채우기
        (function initMembers(){
            const sel = document.getElementById('memberSelect');
            sel.innerHTML = '<option value="">내 직책 선택</option>' +
                MEMBERS.map(m => `<option value="${m}">${m}</option>`).join('');
        })();

        function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
        function normName(s){ return String(s || '').replace(/\s+/g, '').toLowerCase(); }

        // ── 저장/조작 ──
        function saveRestaurant(){
            ref.child('restaurant').set({
                name: document.getElementById('inName').value.trim(),
                location: document.getElementById('inLoc').value.trim()
            });
        }
        function addItem(){
            const inp = document.getElementById('inItem');
            const name = inp.value.trim();
            if(!name) return;
            ref.child('items').push({ name });
            inp.value = '';
            inp.focus();
        }
        function deleteItem(id){
            if(!confirm('이 메뉴 항목을 삭제할까요?')) return;
            const updates = {};
            updates[`/items/${id}`] = null;
            const choices = state.choices || {};
            Object.keys(choices).forEach(m => { if(choices[m] === id) updates[`/choices/${m}`] = null; });
            ref.update(updates);
        }
        // 저장 완료 토스트
        let toastTimer = null;
        function showToast(msg){
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
        }

        function selectItem(id){
            const member = document.getElementById('memberSelect').value;
            if(!member){ alert('내 직책을 먼저 선택해 주세요.'); return; }
            const cur = (state.choices || {})[member];
            const items = state.items || {};
            const name = (items[id] && items[id].name) || '';

            if(cur === id){
                ref.child('choices').child(member).remove()
                    .then(() => showToast('선택을 취소했습니다'))
                    .catch(err => showToast('저장 실패: ' + err.message));
            } else {
                ref.child('choices').child(member).set(id)
                    .then(() => showToast('✓ ' + name + ' · 저장되었습니다'))
                    .catch(err => showToast('저장 실패: ' + err.message));
            }
        }
        // 기타: 직접 입력한 메뉴를 목록에 추가하고 바로 내 선택으로 등록
        function addCustomAndSelect(){
            const member = document.getElementById('memberSelect').value;
            if(!member){ alert('내 직책을 먼저 선택해 주세요.'); return; }

            const inp = document.getElementById('etcItem');
            const name = inp.value.trim();
            if(!name) return;

            // 이미 같은 메뉴가 목록에 있으면 새로 만들지 않고 그 항목을 선택
            const items = state.items || {};
            const existingId = Object.keys(items).find(id => normName(items[id].name) === normName(name));

            if(existingId){
                ref.child('choices').child(member).set(existingId)
                    .then(() => showToast('✓ ' + items[existingId].name + ' · 저장되었습니다'))
                    .catch(err => showToast('저장 실패: ' + err.message));
                inp.value = '';
                return;
            }

            // 새 메뉴 항목 추가 후 내 선택으로 지정
            const newRef = ref.child('items').push({ name });
            newRef.then(() => {
                ref.child('choices').child(member).set(newRef.key);
                inp.value = '';
                showToast('✓ ' + name + ' · 추가하고 저장했습니다');
            }).catch(err => {
                showToast('메뉴 추가 실패: ' + err.message);
            });
        }

        function resetAll(){
            if(!confirm('식당·메뉴·선택을 모두 지우고 새로 시작할까요?\n(⭐ 즐겨찾기는 지워지지 않습니다)')) return;
            ref.remove();
            document.getElementById('memberSelect').value = '';
            setView('setup');
        }

        // ══════ ⭐ 즐겨찾기 ══════
        function favItemNames(f){
            return Array.isArray((f || {}).items) ? f.items.filter(n => String(n || '').trim()) : [];
        }

        // 즐겨찾기 불러오기 → 식당+메뉴 세팅 후 고르기 화면으로
        function loadFavorite(k){
            const f = favs[k] || {};
            const names = favItemNames(f);
            if(!names.length){ alert('이 즐겨찾기에는 저장된 메뉴가 없습니다.\n✏️ 를 눌러 메뉴를 먼저 넣어주세요.'); return; }
            if(!confirm(`「${f.name || ''}」 + 메뉴 ${names.length}개를 불러올까요?\n\n지금 등록된 메뉴와 모두의 선택은 지워집니다.`)) return;

            const items = {};
            names.forEach(n => { items[ref.child('items').push().key] = { name: String(n).trim() }; });
            ref.set({ restaurant: { name: f.name || '', location: f.location || '' }, items })
                .then(() => { showToast('⭐ ' + (f.name || '') + ' · 불러왔습니다'); setView('choose'); })
                .catch(err => showToast('불러오기 실패: ' + err.message));
        }

        function deleteFavorite(k){
            const f = favs[k] || {};
            if(!confirm(`즐겨찾기 「${f.name || ''}」을(를) 삭제할까요?`)) return;
            if(favEditKey === k){ favEditKey = null; favDraft = null; }
            favRef.child(k).remove()
                .then(() => showToast('즐겨찾기를 삭제했습니다'))
                .catch(err => showToast('삭제 실패: ' + err.message));
        }

        // 인라인 편집 열기/닫기
        function toggleFavEdit(k){
            if(favEditKey === k){ cancelFavEdit(); return; }
            const f = favs[k] || {};
            favEditKey = k;
            favDraft = { name: f.name || '', location: f.location || '', items: favItemNames(f).slice() };
            renderFavs();
        }
        function cancelFavEdit(){ favEditKey = null; favDraft = null; renderFavs(); }
        function favDraftSet(field, v){ if(favDraft) favDraft[field] = v; }          // 재렌더 없음 (입력 중 커서 유지)
        function favDraftItem(i, v){ if(favDraft) favDraft.items[i] = v; }
        function favDraftAdd(){ if(!favDraft) return; favDraft.items.push(''); renderFavs(); }
        function favDraftRemove(i){ if(!favDraft) return; favDraft.items.splice(i, 1); renderFavs(); }

        function saveFavEdit(k){
            if(!favDraft) return;
            const name = String(favDraft.name || '').trim();
            if(!name){ alert('식당 이름을 입력해 주세요.'); return; }
            const items = favDraft.items.map(s => String(s || '').trim()).filter(Boolean);
            favRef.child(k).set({ name, location: String(favDraft.location || '').trim(), items, savedAt: Date.now() })
                .then(() => { favEditKey = null; favDraft = null; showToast('⭐ 즐겨찾기를 저장했습니다'); renderFavs(); })
                .catch(err => showToast('저장 실패: ' + err.message));
        }

        function favEditHtml(k){
            const d = favDraft || { name: '', location: '', items: [] };
            const rows = d.items.map((n, i) =>
                `<div class="fe-row"><input type="text" value="${esc(n)}" placeholder="메뉴 이름" oninput="favDraftItem(${i}, this.value)">` +
                `<button class="item-x" onclick="favDraftRemove(${i})" title="이 메뉴 삭제">✕</button></div>`
            ).join('');
            return `<div class="fav-edit">
                <label class="fl">식당 이름</label>
                <input type="text" value="${esc(d.name)}" oninput="favDraftSet('name', this.value)" style="margin-bottom:11px;">
                <label class="fl">위치 (선택)</label>
                <input type="text" value="${esc(d.location)}" oninput="favDraftSet('location', this.value)" style="margin-bottom:13px;">
                <label class="fl">메뉴 (${d.items.length}개)</label>
                ${rows || '<div class="empty">메뉴가 없습니다. 아래에서 추가하세요.</div>'}
                <button class="btn btn-line" style="width:100%;margin-top:5px;" onclick="favDraftAdd()">+ 메뉴 추가</button>
                <div class="fe-actions">
                    <button class="btn btn-pri" style="flex:1;" onclick="saveFavEdit('${k}')">저장</button>
                    <button class="btn btn-line" style="flex:1;" onclick="cancelFavEdit()">취소</button>
                </div>
            </div>`;
        }

        function renderFavs(){
            const box = document.getElementById('favList');
            if(!box) return;
            const keys = Object.keys(favs).sort((a, b) =>
                String((favs[a] || {}).name || '').localeCompare(String((favs[b] || {}).name || ''), 'ko'));

            if(!keys.length){
                box.innerHTML = '<div class="fav-hint">아직 저장된 즐겨찾기가 없습니다.<br>아래에 식당과 메뉴를 넣고 <b>「입력 완료」</b>를 누르면 즐겨찾기에 저장할지 물어봐요. 저장해두면 <b>전체 초기화 후에도</b> 한 번에 불러올 수 있습니다.</div>';
                return;
            }

            box.innerHTML = keys.map(k => {
                const f = favs[k] || {};
                const names = favItemNames(f);
                const sub = names.length ? `메뉴 ${names.length}개 · ${names.join(', ')}` : '저장된 메뉴 없음';
                const editing = favEditKey === k;
                return `<div class="fav-card${editing ? ' editing' : ''}">
                    <div class="fav-main">
                        <div class="fav-info">
                            <div class="fav-name">⭐ ${esc(f.name || '(이름 없음)')}</div>
                            <div class="fav-sub">${esc(sub)}</div>
                        </div>
                        <button class="fav-load" onclick="loadFavorite('${k}')">불러오기</button>
                        <button class="fav-btn" onclick="toggleFavEdit('${k}')" title="즐겨찾기 수정">✏️</button>
                        <button class="fav-btn del" onclick="deleteFavorite('${k}')" title="즐겨찾기 삭제">🗑</button>
                    </div>
                    ${editing ? favEditHtml(k) : ''}
                </div>`;
            }).join('');
        }

        // 「입력 완료」: 즐겨찾기에 저장/갱신할지 물어본 뒤 고르기 화면으로
        function finishSetup(){
            const nameIn = document.getElementById('inName').value.trim();
            const locIn  = document.getElementById('inLoc').value.trim();
            const saved  = state.restaurant || {};

            // 입력칸 내용이 아직 저장 안 됐으면 먼저 반영
            if(nameIn && (nameIn !== (saved.name || '') || locIn !== (saved.location || ''))) saveRestaurant();

            const rname = nameIn || saved.name || '';
            const rloc  = nameIn ? locIn : (saved.location || '');
            const items = state.items || {};
            const names = Object.keys(items).map(id => String((items[id] || {}).name || '').trim()).filter(Boolean);

            if(rname && names.length){
                const key = Object.keys(favs).find(k => normName((favs[k] || {}).name) === normName(rname));
                if(!key){
                    if(confirm(`「${rname}」과(와) 메뉴 ${names.length}개를 ⭐ 즐겨찾기에 저장할까요?\n\n다음에 초기화한 뒤 클릭 한 번으로 불러올 수 있어요.`)){
                        favRef.push({ name: rname, location: rloc, items: names, savedAt: Date.now() })
                            .then(() => showToast('⭐ 즐겨찾기에 저장했습니다'))
                            .catch(err => showToast('저장 실패: ' + err.message));
                    }
                } else {
                    const old = favItemNames(favs[key]);
                    const changed = old.length !== names.length || old.some((n, i) => normName(n) !== normName(names[i]));
                    if(changed && confirm(`⭐ 즐겨찾기 「${rname}」에 저장된 메뉴가 지금과 달라요.\n(저장됨 ${old.length}개 → 지금 ${names.length}개)\n\n지금 메뉴로 갱신할까요?`)){
                        favRef.child(key).update({ name: rname, location: rloc, items: names, savedAt: Date.now() })
                            .then(() => showToast('⭐ 즐겨찾기를 갱신했습니다'))
                            .catch(err => showToast('갱신 실패: ' + err.message));
                    }
                }
            }
            setView('choose');
        }

        // ── 화면 전환 ──
        function applyView(){
            document.getElementById('setupView').classList.toggle('hidden', viewMode !== 'setup');
            document.getElementById('chooseView').classList.toggle('hidden', viewMode !== 'choose');
        }
        function setView(m){
            viewMode = m;
            applyView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ── 렌더 ──
        function renderAll(){
            const r = state.restaurant || {};
            const rname = r.name || '식당 미정';
            document.getElementById('rName').innerText = rname;
            const locEl = document.getElementById('rLoc');
            locEl.innerText = r.location || '';
            locEl.style.display = r.location ? 'block' : 'none';

            // 고르기 화면 상단 접힌 바
            document.getElementById('rbName').innerText = '🍽️ ' + rname;
            const rbLoc = document.getElementById('rbLoc');
            rbLoc.innerText = r.location || '';
            rbLoc.style.display = r.location ? 'block' : 'none';

            const nIn = document.getElementById('inName'), lIn = document.getElementById('inLoc');
            if(document.activeElement !== nIn) nIn.value = r.name || '';
            if(document.activeElement !== lIn) lIn.value = r.location || '';

            renderItemManage();
            renderChoose();

            // 첫 로딩 시 화면 자동 결정: 식당+메뉴 다 있으면 '고르기', 아니면 '설정'
            if(viewMode === null){
                const hasR = !!(state.restaurant && state.restaurant.name);
                const hasItems = !!(state.items && Object.keys(state.items).length);
                viewMode = (hasR && hasItems) ? 'choose' : 'setup';
            }
            applyView();
        }

        function renderItemManage(){
            const items = state.items || {};
            const ids = Object.keys(items);
            const box = document.getElementById('itemManage');
            if(ids.length === 0){ box.innerHTML = '<div class="empty">아직 등록된 메뉴가 없습니다. 위에서 추가하거나 ⭐ 즐겨찾기에서 불러오세요.</div>'; return; }
            box.innerHTML = ids.map(id =>
                `<div class="item-row"><span>${esc(items[id].name)}</span>` +
                `<button class="item-x" onclick="deleteItem('${id}')">✕</button></div>`
            ).join('');
        }

        function renderChoose(){
            const items = state.items || {};
            const choices = state.choices || {};
            const ids = Object.keys(items);
            const member = document.getElementById('memberSelect').value;

            // 항목별 선택자 모으기
            const byItem = {};
            Object.keys(choices).forEach(m => { const it = choices[m]; (byItem[it] = byItem[it] || []).push(m); });

            // 내 선택 배지 (상단 상시 표시)
            const myBox = document.getElementById('myPick');
            if(!member){
                myBox.innerHTML = '';
            } else {
                const myId = choices[member];
                const myName = myId && items[myId] ? items[myId].name : null;
                myBox.innerHTML = myName
                    ? `<div class="my-pick"><span class="mp-lbl">내 선택</span><span class="mp-name">${esc(myName)}</span></div>`
                    : `<div class="my-pick none"><span class="mp-lbl">내 선택</span><span class="mp-name">아직 고르지 않았어요</span></div>`;
            }

            const list = document.getElementById('chooseList');
            if(ids.length === 0){ list.innerHTML = '<div class="empty">등록된 메뉴가 없습니다. 아래 「기타 · 직접 입력」으로 추가할 수 있어요.</div>'; document.getElementById('totalLine').innerText=''; return; }

            list.innerHTML = ids.map(id => {
                const names = byItem[id] || [];
                const mine = member && choices[member] === id;
                const tally = names.length
                    ? `<span class="cnt">${names.length}명</span> · ${names.map(esc).join(', ')}`
                    : '아직 없음';
                return `<div class="choose-row ${mine ? 'mine' : ''}">
                    <div class="ci-info">
                        <div class="ci-name">${esc(items[id].name)}</div>
                        <div class="ci-tally">${tally}</div>
                    </div>
                    <button class="pick-btn ${mine ? 'on' : ''}" onclick="selectItem('${id}')">${mine ? '✓ 선택됨' : '선택'}</button>
                </div>`;
            }).join('');

            const totalChosen = Object.keys(choices).length;
            document.getElementById('totalLine').innerText = totalChosen ? `총 ${totalChosen}명 선택` : '';
        }

        // 🔗 로그인 계정 → 직책 자동 연동
        const EMAIL_TO_MEMBER = {
            'jcy00700@kepco.co.kr':    '위원장',
            'lee.cy@kepco.co.kr':      '수석부위원장',
            'cay0415@kepco.co.kr':     '사무처장',
            'attraction@kepco.co.kr':  '기획처장',
            'ksh7207@kepco.co.kr':     '대외협력본부장',
            'choihosang@kepco.co.kr':  '총무국장',
            'superboy@kepco.co.kr':    '조직쟁의실장',
            'yesiwill@kepco.co.kr':    '기획국장',
            'by.seo@kepco.co.kr':      '정책국장',
            'yuri.kang@kepco.co.kr':   '복지국장',
            'heedo.hwang@kepco.co.kr': '산업안전국장',
            'ppp@kepco.co.kr':         '교육문화국장',
            'son0901@kepco.co.kr':     '손혜석과장',
            'nojohq04@kepco.co.kr':    '홍수정부장',
            'nojohq01@kepco.co.kr':    '김종찬차장',
            'nojohq02@kepco.co.kr':    '이경현과장'
        };

        onAuthReady(function (user) {
            // 로그인한 계정에 해당하는 직책을 자동으로 선택
            const me = EMAIL_TO_MEMBER[(user.email || '').toLowerCase()];
            if (me) document.getElementById('memberSelect').value = me;

            ref.on('value', snap => { state = snap.val() || {}; renderAll(); });
            favRef.on('value', snap => { favs = snap.val() || {}; renderFavs(); });
        });
    </script>
</body>
</html>
